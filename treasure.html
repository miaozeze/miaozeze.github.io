<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未被焚毁的往昔 | 纸页与灰烬</title>
    <style>
        body { 
            margin: 0; padding: 0; background-color: #0a0a0a; color: #c9bda5; 
            font-family: Georgia, "Noto Serif SC", "Songti SC", serif; 
            overflow-x: hidden; min-height: 100vh;
            background-image: 
                radial-gradient(circle at center, #151515 0%, #050505 80%),
                url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.04"/></svg>');
            background-blend-mode: overlay;
            /* 自定义鼠标：古典放大镜 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>') 11 11, auto;
        }

        /* 顶部与按钮 */
        .hud-info {
            position: fixed; top: 30px; left: 40px;
            font-family: "Courier New", monospace; color: #8a6e3e; font-size: 0.8rem; letter-spacing: 0.15rem;
            pointer-events: none; z-index: 100; display: flex; gap: 15px; align-items: center;
        }
        .hud-info span { border-bottom: 1px solid rgba(138, 110, 62, 0.3); padding-bottom: 3px; }

        .back-btn-top {
            position: fixed; top: 30px; right: 40px;
            padding: 10px 24px; color: #e8d5b5; font-size: 0.85rem; letter-spacing: 0.2rem;
            border: 1px solid #5a4a2e; background: rgba(30, 30, 30, 0.8);
            border-radius: 4px; text-decoration: none; z-index: 102; transition: all 0.3s ease;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .back-btn-top:hover { color: #fff; border-color: #9e8a63; background: rgba(158,138,99,0.2); }

        .room-container { max-width: 1000px; margin: 0 auto; padding: 8rem 0 4rem; text-align: center; position: relative; z-index: 10; }
        
        .room-title { 
            font-size: 2rem; color: #f5e6c8; letter-spacing: 0.4rem; margin-bottom: 5rem; font-weight: normal; 
        }

        /* 3D 翻转排版 */
        .flip-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; perspective: 1000px; }
        
        .flip-card { width: 280px; height: 380px; cursor: pointer; }
        .flip-card-inner {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .flip-card:hover .flip-card-inner { transform: rotateY(180deg); }

        /* 触屏点按翻转：靠 .flipped 类控制 */
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }

        .flip-front, .flip-back {
            position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden;
            border: 1px solid #3a3024; background: #151515;
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }

        /* 正面 */
        .flip-front img { width: 100%; height: 240px; object-fit: cover; border: 1px solid #2a2218; margin-bottom: 20px; filter: sepia(20%) grayscale(10%); transition: filter 0.3s; }
        .flip-front:hover img { filter: sepia(0) grayscale(0); }
        .flip-front .name { font-size: 1.15rem; color: #e8d5b5; letter-spacing: 0.1rem; }

        /* 背面 */
        .flip-back { background: #0f0f0f; transform: rotateY(180deg); border-color: #9e8a63; justify-content: flex-start; padding-top: 3rem;}
        .flip-back .owner { font-family: "Courier New", monospace; color: #8a6e3e; font-size: 0.85rem; margin-bottom: 1.5rem; letter-spacing: 0.2rem; border-bottom: 1px dashed #3a3024; padding-bottom: 10px; width: 80%; }
        .flip-back .quote { font-size: 0.95rem; color: #c9bda5; line-height: 2; font-style: italic; padding: 0 10px; text-align: left; text-indent: 2em;}
        .flip-back .click-hint { position: absolute; bottom: 25px; font-size: 0.75rem; color: #5a4a2e; letter-spacing: 0.1rem; }

        /* 弹窗样式 */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; z-index: 200; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .item-card { 
            background: #151515; border: 1px solid #9e8a63; padding: 3rem 2.5rem; max-width: 480px; width: 90%; text-align: center; position: relative; 
            box-shadow: 0 25px 70px rgba(0,0,0,0.95), inset 0 0 20px rgba(0,0,0,0.5);
            transform: scale(0.95); transition: transform 0.4s ease;
        }
        .modal-overlay.active .item-card { transform: scale(1); }

        .close-btn { 
            position: absolute; top: 15px; right: 20px; color: #9e8a63; font-size: 1.5rem; cursor: pointer; transition: color 0.3s; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .close-btn:hover { color: #fff; }
        
        .item-img-container { display: none; height: 200px; margin-bottom: 1.5rem; border: 1px solid #3a3024; }
        .item-img-big { width: 100%; height: 100%; object-fit: cover; filter: sepia(20%); }
        
        .item-name { font-size: 1.6rem; color: #f5e6c8; margin-bottom: 0.5rem; letter-spacing: 0.1rem; }
        .item-owner { font-family: "Courier New", monospace; color: #8a6e3e; font-size: 0.8rem; margin-bottom: 1.5rem; letter-spacing: 0.15rem; }
        
        .item-story { 
            font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", Georgia, serif;
            font-size: 1rem; color: #a89573; line-height: 2.1; text-align: justify; 
            max-height: 40vh; overflow-y: auto; border-left: 2px solid #5a4a2e; padding-left: 15px; padding-right: 10px;
        }
        .item-story::-webkit-scrollbar { width: 4px; }
        .item-story::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .item-story::-webkit-scrollbar-thumb { background: #5a4a2e; border-radius: 2px; }
        
        .back-btn { 
            display: inline-block; padding: 10px 24px; border: 1px solid #5a4a2e; color: #9e8a63; cursor: pointer; margin-top: 25px; transition: all 0.3s; letter-spacing: 0.15rem;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .back-btn:hover { color: #fff; border-color: #9e8a63; background: rgba(158,138,99,0.1); }

        /* 空气中的微尘 */
        .dust-mote {
            position: fixed; background-color: rgba(245, 230, 200, 0.4); border-radius: 50%;
            pointer-events: none; z-index: 2;
            box-shadow: 0 0 4px rgba(245, 230, 200, 0.2);
            animation: floatDust linear infinite;
        }
        @keyframes floatDust {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
        }

        /* 鼠标拖尾 */
        .cursor-trail {
            position: fixed; width: 4px; height: 4px; background: #f5e6c8; border-radius: 50%;
            pointer-events: none; z-index: 9999; box-shadow: 0 0 10px 2px rgba(245, 230, 200, 0.8);
            animation: fadeOutTrail 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes fadeOutTrail { 
            0% { transform: scale(1) translateY(0); opacity: 1; } 
            100% { transform: scale(0) translateY(15px); opacity: 0; } 
        }

        /* === 场景过渡遮罩 === */
        #transition-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #050505; z-index: 999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            opacity: 0; pointer-events: none; transition: opacity 1s ease; 
        }
        #transition-screen.active { opacity: 1; pointer-events: auto; }
        .trans-text { 
            color: #8a6e3e; font-family: "Songti SC", serif; font-size: 1.2rem; letter-spacing: 0.3rem; 
            opacity: 0; transform: translateY(10px); transition: all 1s ease 0.3s; text-align: center; padding: 0 20px;
        }
        #transition-screen.active .trans-text { opacity: 1; transform: translateY(0); }

        /* ==========================================================
           移动端布局适配（< 900px）
           ========================================================== */
        @media (max-width: 900px) {
            .hud-info { top: 12px; left: 12px; font-size: 0.65rem; gap: 8px; }
            .hud-info span { border-bottom: none; padding-bottom: 0; }
            .back-btn-top { top: 12px; right: 12px; padding: 6px 12px; font-size: 0.7rem; letter-spacing: 0.1rem; }

            .room-container { padding: 5rem 16px 3rem; box-sizing: border-box; }
            .room-title { font-size: 1.4rem; letter-spacing: 0.2rem; margin-bottom: 2rem; }

            .flip-grid { gap: 22px; }
            .flip-card { width: 260px; height: 350px; }
            .flip-front { padding: 16px; }
            .flip-front img { height: 200px; margin-bottom: 16px; }
            .flip-front .name { font-size: 1rem; }
            .flip-back { padding-top: 2.4rem; }
            .flip-back .owner { font-size: 0.75rem; margin-bottom: 1.2rem; }
            .flip-back .quote { font-size: 0.88rem; line-height: 1.9; }
            .flip-back .click-hint { bottom: 18px; font-size: 0.7rem; }

            .modal-overlay { padding: 16px; box-sizing: border-box; }
            .item-card {
                padding: 2rem 1.3rem; width: 100%; max-width: 420px; max-height: calc(100vh - 32px);
                box-sizing: border-box; display: flex; flex-direction: column; overflow-y: auto;
            }
            .close-btn { top: 10px; right: 14px; font-size: 1.3rem; }
            .item-img-container { height: 140px; margin-bottom: 1rem; flex-shrink: 0; }
            .item-name { font-size: 1.25rem; }
            .item-owner { font-size: 0.7rem; margin-bottom: 1rem; }
            .item-story { max-height: none; flex: 1 1 auto; min-height: 100px; font-size: 0.92rem; line-height: 1.85; padding-left: 12px; padding-right: 6px; }
            .back-btn { margin-top: 16px; padding: 8px 20px; font-size: 0.8rem; flex-shrink: 0; }
            
            /* 移动端退场文字适配 */
            .trans-text { width: 80%; max-width: 320px; font-size: 0.95rem; letter-spacing: 0.15rem; line-height: 1.8; padding: 0 16px; box-sizing: border-box; }
        }

        /* 触屏设备：禁用 hover 翻转、拖尾、自定义光标 */
        @media (pointer: coarse) {
            body { cursor: auto; }
            .cursor-trail { display: none; }
            .flip-card:hover .flip-card-inner { transform: none; }
            .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        }
    </style>
</head>
<body>
    <div class="hud-info">
        <span id="current-time">00:00</span>
        <span>密室温度 12°C</span>
    </div>

    <a href="javascript:void(0)" onclick="leaveVault()" class="back-btn-top">⎋ [ 离开暗格 ]</a>

    <div class="room-container">
        <h1 class="room-title">未被焚毁的往昔</h1>
        
        <div class="flip-grid">
            <!-- 莉薇娅 -->
            <div class="flip-card" onclick="handleCardTap(this, 'livia')">
                <div class="flip-card-inner">
                    <div class="flip-front">
                        <img src="https://miaozeze.github.io/pocket_watch_1x1_under_300kb.jpg" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100%\' height=\'100%\'><rect width=\'100%\' height=\'100%\' fill=\'%230a0a0a\'/><text x=\'50%\' y=\'50%\' fill=\'%235a4a2e\' font-family=\'serif\' font-size=\'14\' text-anchor=\'middle\'>[ 怀表 ]</text></svg>'">
                        <div class="name">阿尔弗雷德的怀表</div>
                    </div>
                    <div class="flip-back">
                        <div class="owner">持有者: LIVIA</div>
                        <div class="quote">“把背挺直，莉薇娅。女仆的仪态不能乱。”</div>
                        <div class="click-hint">点击探查旧物</div>
                    </div>
                </div>
            </div>
            
            <!-- 埃德蒙 -->
            <div class="flip-card" onclick="handleCardTap(this, 'edmund')">
                <div class="flip-card-inner">
                    <div class="flip-front">
                        <img src="https://miaozeze.github.io/watch.jpg" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100%\' height=\'100%\'><rect width=\'100%\' height=\'100%\' fill=\'%230a0a0a\'/><text x=\'50%\' y=\'50%\' fill=\'%235a4a2e\' font-family=\'serif\' font-size=\'14\' text-anchor=\'middle\'>[ 银链怀表 ]</text></svg>'">
                        <div class="name">银链怀表</div>
                    </div>
                    <div class="flip-back">
                        <div class="owner">持有者: EDMUND</div>
                        <div class="quote">只要秒针还在走，他就能笑眯眯地用那点藏在镜片后的算计，把庄园里的烂摊子抹平。</div>
                        <div class="click-hint">点击探查旧物</div>
                    </div>
                </div>
            </div>
            
            <!-- 星野雫 -->
            <div class="flip-card" onclick="handleCardTap(this, 'shizuku')">
                <div class="flip-card-inner">
                    <div class="flip-front">
                        <img src="https://miaozeze.github.io/ring_under_300kb.jpg" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100%\' height=\'100%\'><rect width=\'100%\' height=\'100%\' fill=\'%230a0a0a\'/><text x=\'50%\' y=\'50%\' fill=\'%235a4a2e\' font-family=\'serif\' font-size=\'14\' text-anchor=\'middle\'>[ 单身戒 ]</text></svg>'">
                        <div class="name">素银单身戒</div>
                    </div>
                    <div class="flip-back">
                        <div class="owner">持有者: SHIZUKU</div>
                        <div class="quote">“这枚戴在左手食指上的单身戒，就是他无声的防御。”</div>
                        <div class="click-hint">点击探查旧物</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="item-card">
            <div class="close-btn" onclick="closeModal()">×</div>
            <div class="item-img-container" id="m-img-container"><img id="m-img" class="item-img-big"></div>
            <h2 class="item-name" id="m-name"></h2>
            <div class="item-owner" id="m-owner"></div>
            <div class="item-story" id="m-story"></div>
            <span class="back-btn" onclick="closeModal()">[ 放回原处 ]</span>
        </div>
    </div>

    <!-- 退场过渡黑屏 -->
    <div id="transition-screen">
        <div class="trans-text" id="trans-text"></div>
    </div>

    <script>
        // 时间显示
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }
        setInterval(updateTime, 1000); updateTime();

        // === 生成空气中的微尘 ===
        function createDust() {
            const dust = document.createElement('div');
            dust.className = 'dust-mote';
            const size = Math.random() * 2 + 1;
            dust.style.width = size + 'px';
            dust.style.height = size + 'px';
            dust.style.left = Math.random() * 100 + 'vw';
            dust.style.bottom = '-10px';
            dust.style.animationDuration = (Math.random() * 8 + 10) + 's';
            document.body.appendChild(dust);
            setTimeout(() => { dust.remove(); }, 20000);
        }
        setInterval(createDust, 400);

        // === 鼠标拖尾 ===
        let lastTrailTime = 0;
        document.addEventListener('mousemove', function(e) {
            const now = Date.now();
            if (now - lastTrailTime > 30) { 
                const particle = document.createElement('div');
                particle.className = 'cursor-trail';
                const offsetX = (Math.random() - 0.5) * 8;
                const offsetY = (Math.random() - 0.5) * 8;
                particle.style.left = (e.clientX + offsetX) + 'px';
                particle.style.top = (e.clientY + offsetY) + 'px';
                const size = Math.random() * 4 + 2; 
                particle.style.width = size + 'px'; 
                particle.style.height = size + 'px';
                document.body.appendChild(particle);
                setTimeout(() => { particle.remove(); }, 800);
                lastTrailTime = now; 
            }
        });

        // ==========================================
        // 触屏卡片点按逻辑
        // ==========================================
        const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;

        function handleCardTap(el, id) {
            if (isTouchDevice) {
                if (!el.classList.contains('flipped')) {
                    document.querySelectorAll('.flip-card.flipped').forEach(c => c.classList.remove('flipped'));
                    el.classList.add('flipped');
                    return;
                }
            }
            openItem(id);
        }

        // ==========================================
        // 👇 音效：把物品放回书架
        // ==========================================
        function playBookOnShelfSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;

                const slideBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
                const slideData = slideBuffer.getChannelData(0);
                for (let i = 0; i < slideData.length; i++) { slideData[i] = Math.random() * 2 - 1; }
                const slideSource = audioCtx.createBufferSource();
                slideSource.buffer = slideBuffer;
                const slideFilter = audioCtx.createBiquadFilter();
                slideFilter.type = 'bandpass';
                slideFilter.frequency.value = 800;
                slideFilter.Q.value = 1.5;
                const slideGain = audioCtx.createGain();
                slideGain.gain.setValueAtTime(0, now);
                slideGain.gain.linearRampToValueAtTime(0.1, now + 0.1);
                slideGain.gain.linearRampToValueAtTime(0.2, now + 0.25);
                slideGain.gain.linearRampToValueAtTime(0, now + 0.3);
                slideSource.connect(slideFilter);
                slideFilter.connect(slideGain);
                slideGain.connect(audioCtx.destination);
                slideSource.start(now);

                setTimeout(() => {
                    const thudBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
                    const thudData = thudBuffer.getChannelData(0);
                    for (let i = 0; i < thudData.length; i++) { thudData[i] = Math.random() * 2 - 1; }
                    const thudSource = audioCtx.createBufferSource();
                    thudSource.buffer = thudBuffer;
                    const thudFilter = audioCtx.createBiquadFilter();
                    thudFilter.type = 'lowpass';
                    thudFilter.frequency.value = 300;
                    const thudGain = audioCtx.createGain();
                    thudGain.gain.setValueAtTime(0, audioCtx.currentTime);
                    thudGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.01);
                    thudGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    thudSource.connect(thudFilter);
                    thudFilter.connect(thudGain);
                    thudGain.connect(audioCtx.destination);
                    thudSource.start();
                }, 260);
            } catch (e) {}
        }

        // === 退场音效：机关合拢 / 沉重石门声 ===
        function playVaultCloseSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;

                const slideBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.8, audioCtx.sampleRate);
                const slideData = slideBuffer.getChannelData(0);
                for (let i = 0; i < slideData.length; i++) { slideData[i] = Math.random() * 2 - 1; }
                const slideSource = audioCtx.createBufferSource();
                slideSource.buffer = slideBuffer;
                const slideFilter = audioCtx.createBiquadFilter();
                slideFilter.type = 'bandpass';
                slideFilter.frequency.value = 1200;
                slideFilter.Q.value = 2;
                const slideGain = audioCtx.createGain();
                slideGain.gain.setValueAtTime(0, now);
                slideGain.gain.linearRampToValueAtTime(0.08, now + 0.2);
                slideGain.gain.linearRampToValueAtTime(0, now + 0.8);
                slideSource.connect(slideFilter);
                slideFilter.connect(slideGain);
                slideGain.connect(audioCtx.destination);
                slideSource.start(now);

                setTimeout(() => {
                    const thudOsc = audioCtx.createOscillator();
                    thudOsc.type = 'sine';
                    thudOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
                    thudOsc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.4);
                    const thudGain = audioCtx.createGain();
                    thudGain.gain.setValueAtTime(0, audioCtx.currentTime);
                    thudGain.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + 0.02);
                    thudGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    thudOsc.connect(thudGain);
                    thudGain.connect(audioCtx.destination);
                    thudOsc.start();
                    thudOsc.stop(audioCtx.currentTime + 0.6);
                }, 650);

            } catch (e) {}
        }

        function closeModal() { 
            playBookOnShelfSound();

                    document.querySelectorAll('.flip-card.flipped').forEach(c => c.classList.remove('flipped'));
