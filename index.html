<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸页与灰烬 | 芥川庄园</title>
    <style>
        /* === 基础页面 === */
        body {
            margin: 0; padding: 0; background-color: #1a1a1a; color: #e8d5b5;
            font-family: "Songti SC", "Noto Serif SC", serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at center, #333333 0%, #151515 70%);
            overflow: hidden;
            
            /* 🖋️ 极简羽毛笔光标 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>') 2 22, auto;
        }
        
        /* === 鼠标拖尾光效粒子 === */
        .cursor-trail {
            position: fixed; width: 4px; height: 4px; background: #f5e6c8; border-radius: 50%;
            pointer-events: none; z-index: 9999; box-shadow: 0 0 10px 2px rgba(245, 230, 200, 0.8);
            animation: fadeOutTrail 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes fadeOutTrail { 0% { transform: scale(1) translateY(0); opacity: 1; } 100% { transform: scale(0) translateY(15px); opacity: 0; } }

        /* === 欢迎信封 === */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at center, #222 0%, #0a0a0a 100%);
            z-index: 100; transition: opacity 1.2s ease, visibility 1.2s ease;
        }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; }

        .envelope {
            background: #151515; border: 1px solid #5a4a2e;
            padding: 4rem 3rem; max-width: 420px; width: 85%; text-align: center;
            position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        .envelope::before {
            content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid #2a2213; pointer-events: none;
        }
        .seal {
            width: 60px; height: 60px; border-radius: 50%;
            background: radial-gradient(circle, #4a3c22 0%, #1a140b 100%);
            border: 1px solid #9e8a63; margin: 0 auto 2rem auto;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.5);
        }
        .seal::after { content: 'A'; font-size: 1.8rem; font-weight: bold; color: #b8a57e; font-family: "Courier New", monospace; }
        .env-to { color: #9e8a63; font-size: 0.8rem; letter-spacing: 0.3rem; margin-bottom: 2rem; text-transform: uppercase; }
        .env-title { color: #e8d5b5; font-size: 1.8rem; letter-spacing: 0.5rem; margin-bottom: 1.5rem; font-weight: normal; }
        .env-desc { color: #b8a57e; font-size: 0.95rem; line-height: 2.2; letter-spacing: 0.1rem; margin-bottom: 3rem; font-style: italic; }
        .open-btn {
            display: inline-block; padding: 12px 30px; border: 1px solid #5a4a2e;
            color: #e8d5b5; font-size: 0.9rem; letter-spacing: 0.2rem; cursor: pointer;
            background: transparent; transition: all 0.4s ease;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .open-btn:hover { color: #fff; border-color: #9e8a63; background: rgba(158,138,99,0.1); box-shadow: 0 0 20px rgba(158,138,99,0.2); }
        .env-footer { margin-top: 3rem; font-size: 0.75rem; color: #5a4a2e; letter-spacing: 0.1rem; }

        /* === 主界面 === */
        #main-screen {
            position: absolute; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transform: translateY(20px); pointer-events: none;
            transition: opacity 1.5s ease, transform 1.5s ease;
            z-index: 10;
        }
        #welcome-screen.hidden + #main-screen { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .invitation {
            border: 1px solid #5a4a2e; padding: 3rem 3rem; max-width: 480px; width: 85%; text-align: center;
            position: relative; background: rgba(30, 30, 30, 0.85); z-index: 1; transition: all 0.6s ease;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
        }
        .invitation:hover { border-color: #9e8a63; box-shadow: 0 15px 50px rgba(0,0,0,0.9), 0 0 25px rgba(158,138,99,0.2); }
        
        .inner-border { border: 1px dashed #5a4a2e; padding: 2.5rem 1rem; display: flex; flex-direction: column; align-items: center; transition: border-color 0.6s ease; }
        .invitation:hover .inner-border { border-color: #8a6e3e; }

        .watermark {
            display: flex; justify-content: space-between; width: 80%;
            margin-top: 0; margin-bottom: 3.5rem; transition: color 0.6s ease;
        }
        .watermark span {
            color: #6b5a3e; font-size: 0.65rem; letter-spacing: 0.2rem; text-transform: uppercase;
        }
        .invitation:hover .watermark span { color: #b8a57e; }
        
        .main-text { color: #e0d0b0; font-size: 1rem; line-height: 2.2; letter-spacing: 0.15rem; margin-bottom: 3rem; }
        
        .btn-group { display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center; }
        .btn {
            position: relative; display: flex; justify-content: space-between; align-items: center;
            width: 85%; padding: 14px 20px; border: 1px solid #5a4a2e; color: #e8d5b5; transition: all 0.4s ease; 
            font-size: 0.95rem; letter-spacing: 0.15rem; background: rgba(255,255,255,0.04); overflow: hidden;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .btn::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px; background-color: #f5e6c8; transform: scaleY(0); transition: transform 0.3s ease; }
        .btn:hover { color: #fff; border-color: #9e8a63; background: rgba(158,138,99,0.15); padding-left: 25px; box-shadow: 0 0 20px rgba(158,138,99,0.2); }
        .btn:hover::before { transform: scaleY(1); } 
        .btn .num { color: #9e8a63; font-size: 0.8rem; font-family: "Courier New", monospace; transition: color 0.3s; }
        .btn:hover .num { color: #fff; }

        /* === 新增：退回信封按钮 === */
        .back-to-welcome {
            position: fixed; bottom: 30px; left: 30px;
            color: #5a4a2e; font-size: 0.8rem; letter-spacing: 0.15rem;
            cursor: pointer; transition: all 0.3s; z-index: 20;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .back-to-welcome:hover { color: #e8d5b5; text-shadow: 0 0 10px rgba(232, 213, 181, 0.5); }

        /* === 弹窗 === */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 200;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .character-card {
            background: #222; border: 1px solid #9e8a63; padding: 3rem 2.5rem; max-width: 480px; width: 85%; text-align: center; position: relative;
            transform: scale(0.95) translateY(15px); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 70px rgba(0,0,0,0.95), 0 0 40px rgba(158,138,99,0.2);
        }
        .modal-overlay.active .character-card { transform: scale(1) translateY(0); }

        .file-number { position: absolute; top: 15px; left: 20px; font-size: 0.75rem; color: #9e8a63; letter-spacing: 0.15rem; font-family: "Courier New", monospace; }
        .close-btn { position: absolute; top: 12px; right: 20px; color: #9e8a63; font-size: 1.5rem; transition: color 0.3s; cursor: pointer; }
        .close-btn:hover { color: #fff; }

        .char-name { font-size: 2rem; color: #f5e6c8; letter-spacing: 0.4rem; margin-bottom: 0.5rem; font-weight: normal; }
        .char-title { font-family: "Courier New", Courier, monospace; font-size: 0.75rem; color: #c9bda5; letter-spacing: 0.15rem; margin-bottom: 2.5rem; text-transform: uppercase; }
        
        .char-content-box {
            font-size: 1rem; color: #e8d5b5; line-height: 1.9; margin-bottom: 2rem; 
            text-align: left; padding-left: 15px; border-left: 2px solid #5a4a2e;
            max-height: 300px; overflow-y: auto; transition: opacity 0.3s ease;
        }
        
        .char-content-box::-webkit-scrollbar { width: 4px; }
        .char-content-box::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .char-content-box::-webkit-scrollbar-thumb { background: #5a4a2e; border-radius: 2px; }
        .char-content-box::-webkit-scrollbar-thumb:hover { background: #9e8a63; }

        .story-p { text-indent: 2em; margin-bottom: 1rem; }
        
        .card-actions { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        
        .action-btn {
            display: inline-block; font-size: 0.85rem; letter-spacing: 0.15rem; transition: all 0.3s; padding: 10px 20px; text-decoration: none; cursor: pointer;
            color: #9e8a63; border: 1px solid #5a4a2e; background: transparent;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .action-btn:hover { color: #fff; border-color: #8a6e3e; background: rgba(158,138,99,0.1); box-shadow: 0 0 15px rgba(158,138,99,0.2); }
        .action-btn.primary { background: rgba(158,138,99,0.2); color: #fff; border-color: #9e8a63; }
        .action-btn.primary:hover { background: rgba(158,138,99,0.4); }

    </style>
</head>
<body>

    <!-- ================= 欢迎邀请函 ================= -->
    <div id="welcome-screen">
        <div class="envelope">
            <div class="seal"></div>
            <div class="env-to">To the Esteemed Guest</div>
            <div class="env-title">纸页与灰烬</div>
            <div class="env-desc">
                在这座被雷雨与旧火包围的庄园里，<br>
                纸页正在泛黄，灰烬仍有温热。<br>
                请在此落款，或推开这扇尘封的门。
            </div>
            <button class="open-btn" onclick="openLetter()">[ 拆 开 信 件 ]</button>
            <div class="env-footer">From Akutagawa Manor</div>
        </div>
    </div>

    <!-- ================= 主界面目录 ================= -->
    <div id="main-screen">
        <div class="invitation">
            <div class="inner-border">
                
                <div class="watermark">
                    <span>P A G E S</span>
                    <span>A N D</span>
                    <span>A S H E S</span>
                </div>
                
                <div class="main-text">
                    致 芥川庄园的贵客：<br>
                    昨夜的雷雨已歇，茶点已备好。<br>
                    请选择您要翻阅的档案。
                </div>

                <div class="btn-group">
                    <span class="btn" onclick="openModal('edmund')">
                        <span>拜访账房</span>
                        <span class="num">[ 01 ]</span>
                    </span>
                    <span class="btn" onclick="openModal('livia')">
                        <span>前往厨房</span>
                        <span class="num">[ 02 ]</span>
                    </span>
                    <span class="btn" onclick="openModal('shizuku')">
                        <span>探访研究室</span>
                        <span class="num">[ 03 ]</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- 新增：左下角退回门外的按钮 -->
        <div class="back-to-welcome" onclick="goBackToWelcome()">[ 退 回 门 外 ]</div>
    </div>

    <!-- ================= 角色档案弹窗 ================= -->
    <div class="modal-overlay" id="modal">
        <div class="character-card">
            <div class="file-number" id="m-file"></div>
            <div class="close-btn" onclick="closeModal()">×</div>
            
            <h2 class="char-name" id="m-name"></h2>
            <div class="char-title" id="m-title"></div>
            
            <div class="char-content-box" id="m-content"></div>
            
            <div class="card-actions">
                <span class="action-btn" onclick="closeModal()">[ 合上卷宗 ]</span>
                <span class="action-btn primary" id="btn-story" onclick="toggleStory()">[ 阅读属于他的故事 ]</span>
            </div>
        </div>
    </div>

    <script>
        // === 拆开信封逻辑 ===
        function openLetter() {
            document.getElementById('welcome-screen').classList.add('hidden');
        }

        // === 退回信封逻辑 ===
        function goBackToWelcome() {
            // 移除 hidden 类，信封重新浮现
            document.getElementById('welcome-screen').classList.remove('hidden');
            // 顺便确保关掉可能打开的弹窗
            closeModal();
        }

        // === 鼠标拖尾光效 ===
        let lastTrailTime = 0;
        document.addEventListener('mousemove', function(e) {
            const now = Date.now();
            if (now - lastTrailTime > 30) { createParticle(e.clientX, e.clientY); lastTrailTime = now; }
        });
        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'cursor-trail';
            const offsetX = (Math.random() - 0.5) * 8;
            const offsetY = (Math.random() - 0.5) * 8;
            particle.style.left = (x + offsetX) + 'px';
            particle.style.top = (y + offsetY) + 'px';
            const size = Math.random() * 4 + 2; 
            particle.style.width = size + 'px'; particle.style.height = size + 'px';
            document.body.appendChild(particle);
            setTimeout(() => { particle.remove(); }, 800);
        }

        // === 角色数据库 ===
        const characters = {
            edmund: {
                file: "FILE NO. 01 // FINANCE",
                name: "埃德蒙",
                title: "Chief Butler / LSE Alumnus",
                quote: `（账房的门虚掩着，里面传来钢笔划过纸页的沙沙声，他推了推金丝眼镜，笑眯眯地抬头）<br><br>“大小姐，如果是来查账的，请进；如果是来捣乱的，请回。哦对了，如果您是来替莉薇娅小姐讨说法的，那笔预算我已经批了，不用谢。”`,
                story: `
                    <p class="story-p">庄园的雷雨在凌晨三点终于停歇，但回南天的潮气依然固执地钻进每一道门缝。你推开账房厚重的橡木门时，里面没有开灯，只有一盏黄铜台灯照亮了桌面。</p>
                    <p class="story-p">“如果您是来核对下个月的采买单，文件在左手边第二格。”埃德蒙没有抬头，金丝眼镜倒映着账本上密密麻麻的数字。但他手里的钢笔尖却微微停顿了一下，一滴墨水洇在了纸上。</p>
                    <p class="story-p">你走过去，看到旁边放着一杯早就凉透的红茶。他总是这样，一算起账来就忘记时间。</p>
                    <p class="story-p">“大小姐，别碰那些发票。”他突然伸出手，轻轻按住了你的手腕，指尖带着常年拿笔的薄茧，温度有些凉，“这些账面上的窟窿，我来填就好。”</p>
                `
            },
            livia: {
                file: "FILE NO. 02 // KITCHEN",
                name: "莉薇娅",
                title: "Exclusive Maid / Yorkshire",
                quote: `（厨房里弥漫着烤饼干的香气，她正冷着脸擦拭银器，看到你推门，手上的动作顿了一下）<br><br>“您又错过晚饭了。牛奶在炉子上，自己拿，别烫着。还有，别指望我会给您加糖。”`,
                story: `<p class="story-p">（在这里写莉薇娅的故事...）</p>`
            },
            shizuku: {
                file: "FILE NO. 03 // RESEARCH",
                name: "星野雫",
                title: "Resident Researcher / Tech Advisor",
                quote: `（研究室里散落着精密的零件和图纸，他正对着模型计算，听到门响，他立刻停下手里的活，长发下的眉眼弯了弯，笑得温和）<br><br>“大小姐，实验数据刚好记录完。红茶和刚烤好的饼干在桌上，您先坐。如果是关于飞机的驾驶问题，或者庄园的技术维护，我随时可以。但如果是埃德蒙先生让您来劝我……换上那套衣服的，请容我礼貌地拒绝。”`,
                story: `<p class="story-p">（在这里写星野雫的故事...）</p>`
            }
        };

        let currentCharId = null;
        let isShowingStory = false;

        function openModal(id) {
            currentCharId = id;
            isShowingStory = false;
            const data = characters[id];
            
            document.getElementById('m-file').innerText = data.file;
            document.getElementById('m-name').innerText = data.name;
            document.getElementById('m-title').innerText = data.title;
            document.getElementById('m-content').innerHTML = data.quote;
            
            const btnStory = document.getElementById('btn-story');
            btnStory.innerText = "[ 阅读属于他的故事 ]";
            
            document.getElementById('modal').classList.add('active');
        }

        function toggleStory() {
            if (!currentCharId) return;
            
            const data = characters[currentCharId];
            const contentBox = document.getElementById('m-content');
            const btnStory = document.getElementById('btn-story');
            
            contentBox.style.opacity = 0;
            
            setTimeout(() => {
                if (isShowingStory) {
                    contentBox.innerHTML = data.quote;
                    btnStory.innerText = "[ 阅读属于他的故事 ]";
                    isShowingStory = false;
                } else {
                    contentBox.innerHTML = data.story;
                    btnStory.innerText = "[ 返回档案首页 ]";
                    isShowingStory = true;
                }
                contentBox.style.opacity = 1;
                contentBox.scrollTop = 0; 
            }, 300);
        }

        function closeModal() { 
            document.getElementById('modal').classList.remove('active'); 
        }
        
        document.getElementById('modal').addEventListener('click', function(e) { 
            if (e.target === this) closeModal(); 
        });
    </script>
</body>
</html>
