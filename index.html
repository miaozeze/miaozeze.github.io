<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸页与灰烬 | 芥川庄园</title>
    <style>
        /* === 基础页面 === */
        body {
            margin: 0; padding: 0; background-color: #050505; color: #c9bda5;
            font-family: "Songti SC", "Noto Serif SC", serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at center, #111 0%, #050505 100%);
            overflow: hidden;
        }
        
        /* === 邀请函主界面 === */
        .invitation {
            border: 1px solid #3a2e1b; padding: 2rem 3rem; max-width: 550px; width: 85%; text-align: center;
            position: relative; background: #050505; z-index: 1;
            transition: border-color 0.6s ease, box-shadow 0.6s ease;
        }
        .invitation:hover { border-color: #8a6e3e; box-shadow: 0 0 30px rgba(138, 110, 62, 0.05); }
        
        .inner-border {
            border: 1px dashed #2a2213; padding: 3rem 2rem;
            display: flex; flex-direction: column; align-items: center;
            transition: border-color 0.6s ease;
        }
        .invitation:hover .inner-border { border-color: #4a3c22; }

        .watermark {
            letter-spacing: 0.6rem; color: #4a3c22; font-size: 0.75rem; 
            margin-top: 0; margin-bottom: 1.5rem; text-transform: uppercase;
        }
        .divider { color: #8a6e3e; font-size: 1.2rem; margin-top: 0; margin-bottom: 2rem; letter-spacing: 0.5rem; }
        .main-text { color: #a89573; font-size: 0.95rem; line-height: 2.2; letter-spacing: 0.15rem; margin-bottom: 2.5rem; }
        
        /* === 升级版：档案目录式按钮（纵向排列） === */
        .btn-group { 
            display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center; 
        }
        .btn {
            display: flex; justify-content: space-between; align-items: center;
            width: 80%; padding: 12px 20px; border: 1px solid #2a2213;
            color: #a89573; cursor: pointer; transition: all 0.4s; font-size: 1rem; letter-spacing: 0.1rem;
            background: rgba(255,255,255,0.01);
        }
        .btn:hover { 
            color: #fff; border-color: #8a6e3e; background: rgba(138,110,62,0.05); 
            box-shadow: 0 0 15px rgba(138,110,62,0.1); padding-left: 25px; /* 悬停时文字微微右移 */
        }
        .btn .num { color: #4a3c22; font-size: 0.8rem; font-family: "Courier New", monospace; }
        .btn:hover .num { color: #8a6e3e; }

        /* === 弹窗背景遮罩 === */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 10;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        /* === 角色专属档案卡 === */
        .character-card {
            background: #0a0a0a; border: 1px solid #4a3c22; padding: 3rem 2.5rem;
            max-width: 500px; width: 85%; text-align: center; position: relative;
            transform: scale(0.95) translateY(10px); 
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .modal-overlay.active .character-card { transform: scale(1) translateY(0); }

        .file-number { position: absolute; top: 15px; left: 20px; font-size: 0.7rem; color: #4a3c22; letter-spacing: 0.1rem; }
        .close-btn { position: absolute; top: 12px; right: 20px; color: #4a3c22; font-size: 1.5rem; cursor: pointer; transition: color 0.3s; }
        .close-btn:hover { color: #e8d5b5; }

        .char-name { font-size: 1.8rem; color: #e8d5b5; letter-spacing: 0.3rem; margin-bottom: 0.5rem; font-weight: normal; }
        .char-title { 
            font-family: "Courier New", Courier, monospace; font-size: 0.75rem; color: #8a6e3e; 
            letter-spacing: 0.15rem; margin-bottom: 2rem; text-transform: uppercase; 
        }
        .char-quote { 
            font-size: 1rem; color: #a89573; line-height: 1.8; margin-bottom: 2.5rem; 
            text-align: left; padding-left: 15px; border-left: 1px solid #333; 
        }
        .back-btn {
            display: inline-block; font-size: 0.8rem; color: #666; cursor: pointer;
            letter-spacing: 0.15rem; transition: color 0.3s; border: 1px solid #222; padding: 8px 15px;
        }
        .back-btn:hover { color: #e8d5b5; border-color: #8a6e3e; background: rgba(138,110,62,0.05); }
    </style>
</head>
<body>

    <!-- 主界面 -->
    <div class="invitation">
        <div class="inner-border">
            <p class="watermark">P A G E S &nbsp; A N D &nbsp; A S H E S</p>
            <div class="divider">✦ ❦ ✦</div>
            
            <div class="main-text">
                致 芥川庄园的贵客：<br>
                昨夜的雷雨已歇，茶点已备好。<br>
                请选择您要翻阅的档案。
            </div>

            <!-- 升级版：目录按钮 -->
            <div class="btn-group">
                <span class="btn" onclick="openModal('edmund')">
                    <span>拜访账房</span>
                    <span class="num">[ 01 ]</span>
                </span>
                <span class="btn" onclick="openModal('livia')">
                    <span>前往厨房</span>
                    <span class="num">[ 02 ]</span>
                </span>
                <!-- 新增：星野雫的入口 -->
                <span class="btn" onclick="openModal('shizuku')">
                    <span>探访研究室</span>
                    <span class="num">[ 03 ]</span>
                </span>
            </div>
        </div>
    </div>

    <!-- 弹窗层 -->
    <div class="modal-overlay" id="modal">
        <div class="character-card">
            <div class="file-number" id="m-file"></div>
            <div class="close-btn" onclick="closeModal()">×</div>
            
            <h2 class="char-name" id="m-name"></h2>
            <div class="char-title" id="m-title"></div>
            <div class="char-quote" id="m-quote"></div>
            
            <div class="back-btn" onclick="closeModal()">[ 合上卷宗 ]</div>
        </div>
    </div>

    <script>
        // === 角色数据库 ===
        const characters = {
            edmund: {
                file: "FILE NO. 01 // FINANCE",
                name: "埃德蒙",
                title: "Chief Butler / LSE Alumnus",
                quote: `（账房的门虚掩着，里面传来钢笔划过纸页的沙沙声，他推了推金丝眼镜，笑眯眯地抬头）<br><br>“大小姐，如果是来查账的，请进；如果是来捣乱的，请回。哦对了，如果您是来替莉薇娅小姐讨说法的，那笔预算我已经批了，不用谢。”`
            },
            livia: {
                file: "FILE NO. 02 // KITCHEN",
                name: "莉薇娅",
                title: "Exclusive Maid / Yorkshire",
                quote: `（厨房里弥漫着烤饼干的香气，她正冷着脸擦拭银器，看到你推门，手上的动作顿了一下）<br><br>“您又错过晚饭了。牛奶在炉子上，自己拿，别烫着。还有，别指望我会给您加糖。”`
            },
            // 新增的星野雫数据
            shizuku: {
                file: "FILE NO. 03 // RESEARCH",
                name: "星野雫",
                title: "Resident Researcher / Tech Advisor",
                quote: `（研究室里散落着精密的零件和图纸，他正对着模型计算，听到门响，他立刻停下手里的活，长发下的眉眼弯了弯，笑得温和）<br><br>“大小姐，实验数据刚好记录完。红茶和刚烤好的饼干在桌上，您先坐。如果是关于飞机的驾驶问题，或者庄园的技术维护，我随时可以。但如果是埃德蒙先生让您来劝我……换上那套衣服的，请容我礼貌地拒绝。”`
            }
        };

        function openModal(id) {
            const data = characters[id];
            document.getElementById('m-file').innerText = data.file;
            document.getElementById('m-name').innerText = data.name;
            document.getElementById('m-title').innerText = data.title;
            document.getElementById('m-quote').innerHTML = data.quote;
            
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) { closeModal(); }
        });
    </script>
</body>
</html>
