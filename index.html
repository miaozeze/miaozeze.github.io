<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芥川庄园大厅 | 纸页与灰烬</title>
    <style>
        /* === 基础环境 === */
        :root {
            --gold-dark: #5a4a2e;
            --gold: #8a6e3e;
            --gold-light: #cfa861;
            --gold-glow: rgba(207, 168, 97, 0.4);
            --bg-dark: #050505;
            --wood-dark: #12100d;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-dark); color: #c9bda5;
            font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
            height: 100vh; overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, #1c1814 0%, #050505 70%),
                url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.05"/></svg>');
            -webkit-font-smoothing: antialiased;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>') 2 22, auto;
        }

        /* 顶部 HUD */
        .hud-info {
            position: fixed; top: 30px; left: 40px; font-family: "Courier New", monospace;
            color: var(--gold); font-size: 0.8rem; letter-spacing: 0.15rem; pointer-events: none; z-index: 100; display: flex; gap: 15px;
        }
        .hud-info span { border-bottom: 1px solid rgba(138, 110, 62, 0.3); padding-bottom: 3px; }

        /* 氛围特效（灰烬） */
        .ash {
            position: fixed; bottom: -10px; background: var(--gold); border-radius: 50%;
            pointer-events: none; z-index: 5; opacity: 0;
            animation: floatUp linear forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            20% { opacity: 0.5; }
            100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
        }

        /* === 场景一：欢迎信函 === */
        #welcome-screen {
            position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
            background: var(--bg-dark); z-index: 100; transition: opacity 1.5s ease, visibility 1.5s;
        }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; }

        .envelope {
            background: #151310; border: 1px solid var(--gold-dark); padding: 4rem 3rem; max-width: 440px; width: 85%;
            text-align: center; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        }
        .envelope::before { content: ''; position: absolute; inset: 12px; border: 1px dashed rgba(138,110,62,0.3); pointer-events: none; }
        .seal {
            width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #6e2424 0%, #2a0808 100%);
            margin: 0 auto 2rem; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.9), inset 0 0 10px rgba(0,0,0,0.8); transform: rotate(-5deg);
        }
        .seal::after { content: '芥'; color: #b8a57e; font-size: 1.6rem; font-family: "Songti SC", serif; text-shadow: 1px 1px 2px #000; }
        .env-title { color: #f5e6c8; font-size: 1.8rem; letter-spacing: 0.5rem; margin-bottom: 1.5rem; }
        .env-desc { color: #a89573; line-height: 2; font-size: 0.95rem; margin-bottom: 2.5rem; font-style: italic; }
        .open-btn {
            display: inline-block; padding: 12px 30px; color: #e8d5b5; border: 1px solid var(--gold-dark);
            text-decoration: none; letter-spacing: 0.2rem; transition: all 0.4s;
        }
        .open-btn:hover { background: rgba(207,168,97,0.1); border-color: var(--gold-light); color: #fff; }

        /* === 场景二：平铺静物大厅 === */
        #hall-screen {
            position: absolute; inset: 0; display: flex; justify-content: center; align-items: center;
            opacity: 0; transform: scale(0.98); pointer-events: none; transition: opacity 1.5s ease, transform 1.5s ease;
            z-index: 10;
        }
        #welcome-screen.hidden + #hall-screen { opacity: 1; transform: scale(1); pointer-events: auto; }

        /* 倾斜的长桌面 */
        .desk-surface {
            position: relative; width: 85%; max-width: 1100px; height: 70vh;
            background: linear-gradient(135deg, rgba(25, 22, 18, 0.9), rgba(10, 8, 6, 0.95));
            border: 1px solid rgba(90, 74, 46, 0.4);
            box-shadow: 0 40px 100px rgba(0,0,0,0.9), inset 0 0 100px rgba(0,0,0,0.8);
            border-radius: 8px; display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap;
            padding: 40px; box-sizing: border-box;
        }

        /* 桌面木纹背景 */
        .desk-surface::before {
            content: ''; position: absolute; inset: 0;
            background-image: repeating-linear-gradient(90deg, transparent 0, transparent 50px, rgba(0,0,0,0.1) 50px, rgba(0,0,0,0.1) 100px);
            opacity: 0.5; pointer-events: none; border-radius: 8px;
        }

        .desk-item {
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); z-index: 10;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }

        /* 物品底座发光 */
        .desk-item::after {
            content: ''; position: absolute; bottom: -10px; width: 80px; height: 20px;
            background: radial-gradient(ellipse, var(--gold-glow) 0%, transparent 70%);
            opacity: 0.2; transition: all 0.5s; filter: blur(5px);
        }

        .desk-item:hover { transform: translateY(-15px) scale(1.05); z-index: 20; }
        .desk-item:hover::after { opacity: 1; width: 120px; height: 30px; }

        /* === 物品 UI 设计 === */
        .item-label {
            margin-top: 25px; text-align: center; opacity: 0.6; transition: all 0.4s;
        }
        .item-label .title { display: block; color: #f5e6c8; font-size: 1.2rem; letter-spacing: 0.2rem; margin-bottom: 5px; }
        .item-label .sub { display: block; color: var(--gold); font-family: "Courier New", monospace; font-size: 0.75rem; letter-spacing: 0.1rem; }
        .desk-item:hover .item-label { opacity: 1; transform: translateY(-5px); }
        .desk-item:hover .item-label .title { text-shadow: 0 0 15px var(--gold-light); }

        /* 1. 账房：老式墨水瓶与羽毛笔 */
        .obj-ledger {
            width: 90px; height: 90px; position: relative;
        }
        .inkwell {
            position: absolute; bottom: 0; left: 10px; width: 70px; height: 50px;
            background: linear-gradient(135deg, #222 0%, #050505 100%);
            border-radius: 10px 10px 5px 5px; box-shadow: inset 0 5px 10px rgba(255,255,255,0.1), 0 10px 20px #000;
            border: 1px solid #333;
        }
        .inkwell::before { content: ''; position: absolute; top: -10px; left: 15px; width: 40px; height: 15px; background: #111; border-radius: 50%; border: 2px solid #222; }
        .feather {
            position: absolute; bottom: 40px; left: 40px; width: 20px; height: 80px;
            background: linear-gradient(to top, transparent, #f5e6c8);
            border-radius: 50% 50% 0 0; transform: rotate(15deg);
            clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%);
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.8));
        }
        .feather::after { content: ''; position: absolute; bottom: -10px; left: 8px; width: 2px; height: 40px; background: #cfa861; transform: rotate(-15deg); }

        /* 2. 厨房：黄铜服务铃 */
        .obj-kitchen {
            width: 90px; height: 90px; position: relative;
        }
        .bell {
            position: absolute; bottom: 10px; left: 15px; width: 60px; height: 45px;
            background: radial-gradient(circle at 30% 20%, #e8d5b5 0%, #8a6e3e 40%, #3a2b12 100%);
            border-radius: 30px 30px 5px 5px; box-shadow: inset -5px -5px 15px rgba(0,0,0,0.8), 0 10px 20px #000;
        }
        .bell::before { content: ''; position: absolute; top: -8px; left: 27px; width: 10px; height: 10px; background: #cfa861; border-radius: 50%; box-shadow: 0 2px 4px #000; }
        .bell::after { content: ''; position: absolute; bottom: -5px; left: -5px; width: 70px; height: 10px; background: #1a1a1a; border-radius: 5px; box-shadow: 0 2px 5px #000; }

        /* 3. 研究室：发光的电子管 */
        .obj-research {
            width: 90px; height: 90px; position: relative; display: flex; justify-content: center; align-items: flex-end;
        }
        .tube-base {
            width: 40px; height: 30px; background: #222; border-radius: 5px 5px 0 0; border: 1px solid #444;
        }
        .tube-glass {
            position: absolute; bottom: 25px; width: 34px; height: 60px;
            background: rgba(100, 150, 200, 0.1);
            border-radius: 17px 17px 5px 5px; border: 1px solid rgba(150, 200, 255, 0.4);
            box-shadow: inset 0 0 10px rgba(100, 200, 255, 0.2); overflow: hidden;
        }
        .filament {
            position: absolute; bottom: 10px; left: 14px; width: 4px; height: 30px;
            background: #ffb347; border-radius: 2px; box-shadow: 0 0 15px #ffb347, 0 0 30px #ff8c00;
            animation: flicker 2s infinite alternate;
        }
        @keyframes flicker { 0% { opacity: 0.8; } 100% { opacity: 1; box-shadow: 0 0 20px #ffb347, 0 0 40px #ff8c00; } }

        /* 4. 档案室：羊皮卷与红丝带 */
        .obj-archive {
            width: 90px; height: 90px; position: relative; display: flex; justify-content: center; align-items: center;
        }
        .scroll {
            width: 70px; height: 50px; background: #d1c5a8;
            border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            position: relative; transform: rotate(-5deg);
        }
        .scroll::before, .scroll::after {
            content: ''; position: absolute; top: -5px; bottom: -5px; width: 12px;
            background: #b8a57e; border-radius: 6px; box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .scroll::before { left: -6px; }
        .scroll::after { right: -6px; }
        .ribbon {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 15px; height: 70px; background: #8b2c2c; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* 5. 暗格（隐藏触发点） */
        .secret-trigger {
            position: absolute; bottom: 20px; right: 30px; width: 60px; height: 20px;
            background: #0a0806; border-radius: 2px; z-index: 5;
            border-bottom: 1px solid rgba(90, 74, 46, 0.2);
            transition: all 0.4s; cursor: pointer;
        }
        .secret-trigger:hover {
            border-bottom-color: var(--gold-light);
            box-shadow: 0 5px 15px rgba(207, 168, 97, 0.4);
        }
        .secret-text {
            position: absolute; bottom: -20px; right: 0; font-size: 0.65rem;
            color: var(--gold); font-family: "Courier New", monospace; opacity: 0; transition: all 0.4s;
            white-space: nowrap;
        }
        .secret-trigger:hover .secret-text { opacity: 1; bottom: 25px; }

        /* 顶部返回/退出 */
        .leave-btn {
            position: fixed; top: 30px; right: 40px; padding: 10px 24px; color: #e8d5b5;
            border: 1px solid var(--gold-dark); background: rgba(20,20,20,0.8);
            font-size: 0.85rem; letter-spacing: 0.2rem; cursor: pointer; z-index: 102; transition: all 0.3s;
        }
        .leave-btn:hover { background: rgba(158,138,99,0.2); color: #fff; border-color: var(--gold); }

        /* === 过渡遮罩 === */
        #transition-screen {
            position: fixed; inset: 0; background: #050505; z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 1s ease;
        }
        #transition-screen.active { opacity: 1; pointer-events: auto; }
        .trans-text {
            color: var(--gold); font-family: "Songti SC", serif; font-size: 1.2rem; letter-spacing: 0.3rem;
            opacity: 0; transform: translateY(10px); transition: all 1s ease 0.3s; text-align: center;
        }
        #transition-screen.active .trans-text { opacity: 1; transform: translateY(0); }

        /* === 移动端适配 === */
        @media (max-width: 900px) {
            .hud-info { top: 12px; left: 12px; font-size: 0.65rem; }
            .leave-btn { top: 12px; right: 12px; padding: 6px 12px; font-size: 0.7rem; }
            
            .desk-surface {
                width: 92%; height: 80vh; flex-direction: column; flex-wrap: nowrap;
                padding: 30px 10px; gap: 30px; overflow-y: auto; justify-content: flex-start;
            }
            .desk-item { margin-bottom: 10px; }
            .secret-trigger { bottom: 10px; right: 15px; }
            .secret-text { font-size: 0.6rem; }
        }

        @media (pointer: coarse) {
            body { cursor: auto; }
            .desk-item { cursor: pointer; }
        }
    </style>
</head>
<body>
    <div class="hud-info">
        <span id="current-time">00:00</span>
        <span>阴雨 · 低气压</span>
    </div>

    <!-- 欢迎信函 -->
    <div id="welcome-screen">
        <div class="envelope">
            <div class="seal"></div>
            <div class="env-title">纸页与灰烬</div>
            <div class="env-desc">
                在这座被雷雨与旧火包围的庄园里，<br>
                纸页正在泛黄，灰烬仍有温热。<br>
                请落款，或拆开这封信件。
            </div>
            <a href="javascript:void(0);" onclick="openHall()" class="open-btn">[ 拆 开 信 件 ]</a>
        </div>
    </div>

    <!-- 平铺静物大厅 -->
    <div id="hall-screen">
        <div class="leave-btn" onclick="leaveManor()">⎋ 离开</div>
        
        <div class="desk-surface">
            <!-- 账房 -->
            <div class="desk-item" onclick="enterRoom('ledger.html', '穿过长廊，黄铜把手微微发凉。')">
                <div class="obj-ledger">
                    <div class="inkwell"></div>
                    <div class="feather"></div>
                </div>
                <div class="item-label">
                    <span class="title">拜访账房</span>
                    <span class="sub">LEDGER OFFICE</span>
                </div>
            </div>

            <!-- 厨房 -->
            <div class="desk-item" onclick="enterRoom('kitchen.html', '食物的香气盖过了灰尘的味道。')">
                <div class="obj-kitchen">
                    <div class="bell"></div>
                </div>
                <div class="item-label">
                    <span class="title">前往厨房</span>
                    <span class="sub">KITCHEN</span>
                </div>
            </div>

            <!-- 研究室 -->
            <div class="desk-item" onclick="enterRoom('research.html', '属于机械与电波的冷冽气息迎面而来。')">
                <div class="obj-research">
                    <div class="tube-base"></div>
                    <div class="tube-glass"><div class="filament"></div></div>
                </div>
                <div class="item-label">
                    <span class="title">探访研究室</span>
                    <span class="sub">RESEARCH LAB</span>
                </div>
            </div>

            <!-- 档案室 -->
            <div class="desk-item" onclick="enterRoom('archive.html', '沿着旋梯向上，灰尘在光柱中翻涌。')">
                <div class="obj-archive">
                    <div class="scroll"></div>
                    <div class="ribbon"></div>
                </div>
                <div class="item-label">
                    <span class="title">前往档案室</span>
                    <span class="sub">ARCHIVES</span>
                </div>
            </div>

            <!-- 隐藏的暗格 -->
            <div class="secret-trigger" onclick="goToTreasure()">
                <div class="secret-text">[ 开启不存在的暗格 ]</div>
            </div>
        </div>
    </div>

    <!-- 过渡遮罩层 -->
    <div id="transition-screen">
        <div class="trans-text" id="trans-text"></div>
    </div>

    <script>
        // === 基础系统 ===
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }
        setInterval(updateTime, 1000); updateTime();

        // 灰烬飘浮
        function createAsh() {
            const ash = document.createElement('div'); ash.className = 'ash';
            const size = Math.random() * 3 + 1; ash.style.width = size + 'px'; ash.style.height = size + 'px';
            ash.style.left = Math.random() * 100 + 'vw';
            ash.style.animationDuration = (Math.random() * 5 + 6) + 's';
            document.body.appendChild(ash); setTimeout(() => { ash.remove(); }, 11000);
        }
        setInterval(createAsh, 400);

        // === 音效引擎 ===
        let sharedAudioCtx = null;
        function getAudioCtx() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return null;
            if (!sharedAudioCtx || sharedAudioCtx.state === 'closed') sharedAudioCtx = new AudioContext();
            if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
            return sharedAudioCtx;
        }

        function playDoorOpenSound() {
            try {
                const audioCtx = getAudioCtx(); if (!audioCtx) return; 
                const now = audioCtx.currentTime;
                // 吱呀声
                const creakBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.4, audioCtx.sampleRate);
                const creakData = creakBuffer.getChannelData(0);
                for (let i = 0; i < creakData.length; i++) { creakData[i] = Math.random() * 2 - 1; }
                const creakSource = audioCtx.createBufferSource(); creakSource.buffer = creakBuffer;
                const creakFilter = audioCtx.createBiquadFilter(); creakFilter.type = 'bandpass'; creakFilter.frequency.setValueAtTime(800, now); creakFilter.frequency.linearRampToValueAtTime(400, now + 0.4); creakFilter.Q.value = 2;
                const creakGain = audioCtx.createGain(); creakGain.gain.setValueAtTime(0, now); creakGain.gain.linearRampToValueAtTime(0.08, now + 0.1); creakGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                creakSource.connect(creakFilter); creakFilter.connect(creakGain); creakGain.connect(audioCtx.destination); creakSource.start(now);

                // 脚步
                for (let i = 0; i < 3; i++) {
                    const stepTime = now + 0.2 + (i * 0.4);
                    const stepOsc = audioCtx.createOscillator(); stepOsc.type = 'sine'; stepOsc.frequency.setValueAtTime(80, stepTime); stepOsc.frequency.exponentialRampToValueAtTime(30, stepTime + 0.1);
                    const stepGain = audioCtx.createGain(); stepGain.gain.setValueAtTime(0, stepTime); stepGain.gain.linearRampToValueAtTime(0.2, stepTime + 0.02); stepGain.gain.exponentialRampToValueAtTime(0.01, stepTime + 0.15);
                    stepOsc.connect(stepGain); stepGain.connect(audioCtx.destination); stepOsc.start(stepTime); stepOsc.stop(stepTime + 0.2);
                }
            } catch (e) {}
        }

        function playVaultOpenSound() {
            try {
                const audioCtx = getAudioCtx(); if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const slideBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.8, audioCtx.sampleRate);
                const slideData = slideBuffer.getChannelData(0);
                for (let i = 0; i < slideData.length; i++) { slideData[i] = Math.random() * 2 - 1; }
                const slideSource = audioCtx.createBufferSource(); slideSource.buffer = slideBuffer;
                const slideFilter = audioCtx.createBiquadFilter(); slideFilter.type = 'bandpass'; slideFilter.frequency.value = 1200; slideFilter.Q.value = 2;
                const slideGain = audioCtx.createGain(); slideGain.gain.setValueAtTime(0, now); slideGain.gain.linearRampToValueAtTime(0.08, now + 0.2); slideGain.gain.linearRampToValueAtTime(0, now + 0.8);
                slideSource.connect(slideFilter); slideFilter.connect(slideGain); slideGain.connect(audioCtx.destination); slideSource.start(now);

                setTimeout(() => {
                    const thudOsc = audioCtx.createOscillator(); thudOsc.type = 'sine'; thudOsc.frequency.setValueAtTime(60, audioCtx.currentTime); thudOsc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.4);
                    const thudGain = audioCtx.createGain(); thudGain.gain.setValueAtTime(0, audioCtx.currentTime); thudGain.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + 0.02); thudGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    thudOsc.connect(thudGain); thudGain.connect(audioCtx.destination); thudOsc.start(); thudOsc.stop(audioCtx.currentTime + 0.6);
                }, 650);
            } catch (e) {}
        }

        // === 核心交互 ===
        function openHall() {
            document.getElementById('welcome-screen').classList.add('hidden');
            sessionStorage.setItem('rainPlaying', 'true');
        }

        function enterRoom(url, text) {
            playDoorOpenSound();
            document.getElementById('trans-text').innerText = text;
            document.getElementById('transition-screen').classList.add('active');
            setTimeout(() => { window.location.href = url; }, 1800);
        }

        function goToTreasure() {
            playVaultOpenSound();
            document.getElementById('trans-text').innerText = '暗格开启，往昔的秘密在黑暗中低语。';
            document.getElementById('transition-screen').classList.add('active');
            setTimeout(() => { window.location.href = 'treasure.html'; }, 1800);
        }

        function leaveManor() {
            document.getElementById('welcome-screen').classList.remove('hidden');
            sessionStorage.removeItem('rainPlaying');
        }

        // 页面重载处理（比如从其他房间后退回来）
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('open') === 'true') {
                document.getElementById('welcome-screen').classList.add('hidden');
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>
</body>
</html>
