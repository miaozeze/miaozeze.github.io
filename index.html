<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芥川庄园邀请函</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #050505; color: #c9bda5; /* 偏暗的香槟金/米色 */
            font-family: "Songti SC", "Noto Serif SC", serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            /* 模拟羊皮纸或暗色纹理背景 */
            background-image: radial-gradient(circle at center, #111 0%, #050505 100%);
        }
        .invitation {
            border: 1px solid #8a6e3e; /* 暗金色边框 */
            padding: 2rem; max-width: 600px; width: 85%; text-align: center;
            position: relative;
        }
        /* 内层细线框 */
        .inner-border {
            border: 1px dashed #4a3c22; padding: 3rem 2rem;
        }
        .title {
            font-size: 2.8rem; color: #e8d5b5; letter-spacing: 0.6rem;
            margin-bottom: 1rem; margin-top: 0; font-weight: normal;
            text-shadow: 0 0 10px rgba(232, 213, 181, 0.2); /* 微微的烫金发光 */
        }
        .divider {
            color: #8a6e3e; font-size: 1.2rem; margin: 1.5rem 0; letter-spacing: 0.5rem;
        }
        .text {
            color: #a89573; font-size: 1rem; line-height: 2; letter-spacing: 0.1rem;
            margin-bottom: 2.5rem;
        }
        
        /* 复古的文本按钮 */
        .btn {
            display: inline-block; border-bottom: 1px solid #8a6e3e;
            padding: 5px 10px; color: #e8d5b5; cursor: pointer;
            transition: all 0.3s; font-size: 1.1rem;
        }
        .btn:hover { color: #fff; border-bottom-color: #fff; text-shadow: 0 0 8px #fff; }
        .btn-space { margin: 0 15px; }
    </style>
</head>
<body>
    <div class="invitation">
        <div class="inner-border">
            <h1 class="title">纸页与灰烬</h1>
            <div class="divider">✦ ❦ ✦</div>
            
            <div class="text">
                致 芥川庄园的贵客：<br>
                昨夜的雷雨已歇，茶点已备好。<br>
                无论您是来找人算账，还是来寻一口热汤。
            </div>

            <div>
                <span class="btn">拜访账房</span>
                <span class="btn btn-space">前往厨房</span>
            </div>
        </div>
    </div>
</body>
</html>
