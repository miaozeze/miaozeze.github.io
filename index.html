<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>档案卷宗 | 纸页与灰烬</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #0c0c0c; color: #a8a8a8;
            /* 使用等宽字体模拟打字机 */
            font-family: "Courier New", Courier, monospace;
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .dossier {
            max-width: 650px; width: 90%; padding: 3rem;
            background: #111; border-top: 4px solid #333; border-bottom: 1px solid #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }
        /* 机密印章 */
        .stamp {
            position: absolute; top: 20px; right: 20px;
            border: 2px solid #5a2a2a; color: #5a2a2a;
            padding: 5px 10px; font-weight: bold; font-size: 1.2rem;
            transform: rotate(15deg); letter-spacing: 0.2rem; opacity: 0.7;
        }
        .header { border-bottom: 1px dashed #333; padding-bottom: 1rem; margin-bottom: 2rem; color: #666; font-size: 0.9rem; }
        .title { font-size: 2.2rem; color: #d1d1d1; letter-spacing: 0.2rem; margin-bottom: 0.5rem; }
        .subtitle { font-size: 0.9rem; color: #555; letter-spacing: 0.1rem; margin-bottom: 2rem; }
        .content { line-height: 1.8; font-size: 1rem; color: #999; margin-bottom: 3rem; }
        .content span { color: #ccc; background: #222; padding: 0 5px; }
        
        /* 打字机风格按钮 */
        .btn-group { display: flex; gap: 20px; flex-wrap: wrap; }
        .type-btn {
            background: transparent; border: 1px solid #444; color: #a8a8a8;
            padding: 10px 20px; font-family: inherit; font-size: 0.9rem;
            cursor: crosshair; transition: all 0.2s;
        }
        .type-btn:hover { background: #222; color: #fff; border-color: #888; }
    </style>
</head>
<body>
    <div class="dossier">
        <div class="stamp">机密</div>
        <div class="header">FILE NO. 1904 // SUBJECT: ASHES</div>
        <div class="title">纸页与灰烬</div>
        <div class="subtitle">PAGES AND ASHES</div>
        
        <div class="content">
            记录显示，奥斯汀家族的旧宅已完全烧毁。<br>
            幸存者：<span>莉薇娅</span>（女仆）。<br>
            资金流向：<span>埃德蒙</span>（管家）负责平账。<br><br>
            请选择您要查阅的当事人。
        </div>

        <div class="btn-group">
            <span class="type-btn">> 调取账房记录</span>
            <span class="type-btn">> 询问厨房事宜</span>
        </div>
    </div>
</body>
</html>
