<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Welcome | 芥川庄园</title>
    <style>
        body { 
            background-color: #050505; 
            color: #888; 
            font-family: "Georgia", "Songti SC", serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .welcome-text { 
            font-size: 1.2em; 
            letter-spacing: 5px; 
            margin-bottom: 40px; 
            opacity: 0; 
            animation: fadeIn 2s forwards; 
        }
        .enter-gate { 
            border: none; 
            background: none; 
            color: #444; 
            font-size: 1em; 
            letter-spacing: 2px; 
            cursor: pointer; 
            padding: 10px 20px; 
            transition: all 0.5s ease; 
            opacity: 0; 
            animation: fadeIn 2s 1s forwards; 
            text-decoration: none;
        }
        .enter-gate:hover { 
            color: #fff; 
            letter-spacing: 4px; 
        }
        
        /* 简单的淡入动画 */
        @keyframes fadeIn { 
            to { opacity: 1; } 
        }
    </style>
</head>
<body>
    <div class="welcome-text">
        山海、风雪、雨爱。
    </div>
    <!-- 点击这里跳转到 home.html -->
    <a href="home.html" class="enter-gate">[ 推 门 进 入 ]</a>
</body>
</html>
