<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸页与灰烬 | 芥川庄园</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #050505; color: #c9bda5;
            font-family: "Songti SC", "Noto Serif SC", serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at center, #111 0%, #050505 100%);
        }
        .invitation {
            border: 1px solid #8a6e3e; padding: 2rem; max-width: 600px; width: 85%; text-align: center;
            position: relative;
        }
        .inner-border {
            border: 1px dashed #4a3c22; padding: 3rem 2rem; transition: all 0.3s ease;
            display: flex; flex-direction: column; align-items: center;
        }
        
        /* 顶部的花边，去掉了大标题后，让它作为视觉起点 */
        .divider { 
            color: #8a6e3e; font-size: 1.2rem; margin-top: 0; margin-bottom: 2.5rem; letter-spacing: 0.5rem; 
        }
        
        /* 文本区域 */
        .text-box {
            color: #a89573; font-size: 1rem; line-height: 2; letter-spacing: 0.1rem;
            margin-bottom: 3rem; min-height: 120px; 
            transition: opacity 0.3s ease;
            display: flex; flex-direction: column; justify-content: center;
        }
        
        .btn-group { display: flex; gap: 20px; justify-content: center; margin-bottom: 1rem; }
        
        .btn {
            border-bottom: 1px solid #8a6e3e;
            padding: 5px 10px; color: #e8d5b5; cursor: pointer;
            transition: all 0.3s; font-size: 1.1rem;
        }
        .btn:hover { color: #fff; border-bottom-color: #fff; text-shadow: 0 0 8px #fff; }
        
        /* 返回按钮（默认隐藏） */
        #back-btn {
            font-size: 0.8rem; color: #666; cursor: pointer;
            margin-top: 15px; text-decoration: underline; text-decoration-color: #333;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #back-btn:hover { color: #aaa; }
        #back-btn.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>
    <div class="invitation">
        <div class="inner-border">
            <!-- 大标题被移除了，直接从花边开始 -->
            <div class="divider">✦ ❦ ✦</div>
            
            <div class="text-box" id="dialogue-text">
                <!-- 默认内容 -->
                <div id="default-text">
                    致 芥川庄园的贵客：<br>
                    昨夜的雷雨已歇，茶点已备好。<br>
                    无论您是来找人算账，还是来寻一口热汤。
                </div>
            </div>

            <div class="btn-group">
                <span class="btn" onclick="changeText('study')">拜访账房</span>
                <span class="btn" onclick="changeText('kitchen')">前往厨房</span>
            </div>
            
            <!-- 新增的返回按钮 -->
            <div id="back-btn" onclick="resetText()">[ 合上卷宗，退后一步 ]</div>
        </div>
    </div>

    <script>
        const textBox = document.getElementById('dialogue-text');
        const backBtn = document.getElementById('back-btn');
        
        const texts = {
            study: "（账房的门虚掩着，里面传来钢笔划过纸页的沙沙声）<br>“大小姐，如果是来查账的，请进；如果是来捣乱的，请回。”<br><span style='font-size:0.8rem; color:#8a6e3e;'>—— 埃德蒙</span>",
            kitchen: "（厨房里弥漫着烤饼干的香气，但主人的脸色不太好）<br>“您又错过晚饭了。牛奶在炉子上，自己拿，别烫着。”<br><span style='font-size:0.8rem; color:#8a6e3e;'>—— 莉薇娅</span>"
        };

        function changeText(target) {
            textBox.style.opacity = 0;
            
            setTimeout(() => {
                textBox.innerHTML = texts[target];
                textBox.style.opacity = 1;
                backBtn.classList.add('show');
            }, 300);
        }

        function resetText() {
            textBox.style.opacity = 0;
            backBtn.classList.remove('show');
            
            setTimeout(() => {
                textBox.innerHTML = `<div id="default-text">
                    致 芥川庄园的贵客：<br>
                    昨夜的雷雨已歇，茶点已备好。<br>
                    无论您是来找人算账，还是来寻一口热汤。
                </div>`;
                textBox.style.opacity = 1;
            }, 300);
        }
    </script>
</body>
</html>
