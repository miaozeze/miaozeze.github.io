<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸页与灰烬 | 芥川庄园</title>
    <style>
        /* === 基础页面 === */
        body {
            margin: 0; padding: 0; background-color: #050505; color: #c9bda5;
            font-family: "Songti SC", "Noto Serif SC", serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at center, #111 0%, #050505 100%);
            overflow: hidden;
        }
        
        /* === 邀请函主界面 === */
        .invitation {
            border: 1px solid #3a2e1b; padding: 2rem; max-width: 600px; width: 85%; text-align: center;
            position: relative; background: #050505; z-index: 1;
            transition: border-color 0.6s ease, box-shadow 0.6s ease;
        }
        
        /* 鼠标悬停在主界面时，边框会有极微弱的微光 */
        .invitation:hover {
            border-color: #8a6e3e;
            box-shadow: 0 0 30px rgba(138, 110, 62, 0.05);
        }

        .inner-border {
            border: 1px dashed #2a2213; padding: 3.5rem 2rem;
            display: flex; flex-direction: column; align-items: center;
            transition: border-color 0.6s ease;
        }
        .invitation:hover .inner-border { border-color: #4a3c22; }

        /* 英文水印抬头 */
        .watermark {
            letter-spacing: 0.6rem; color: #4a3c22; font-size: 0.75rem; 
            margin-top: 0; margin-bottom: 1.5rem; text-transform: uppercase;
        }
        
        .divider { color: #8a6e3e; font-size: 1.2rem; margin-top: 0; margin-bottom: 2.5rem; letter-spacing: 0.5rem; }
        
        .main-text { color: #a89573; font-size: 1rem; line-height: 2.2; letter-spacing: 0.15rem; margin-bottom: 3.5rem; }
        
        .btn-group { display: flex; gap: 30px; justify-content: center; }
        
        .btn {
            border-bottom: 1px solid #4a3c22; padding: 5px 10px; color: #a89573; cursor: pointer;
            transition: all 0.4s; font-size: 1.05rem; letter-spacing: 0.15rem;
            position: relative;
        }
        .btn:hover { color: #fff; border-bottom-color: #e8d5b5; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* === 弹窗背景遮罩 === */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 10;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        /* === 角色专属档案卡（进阶设计） === */
        .character-card {
            background: #0a0a0a; border: 1px solid #4a3c22; padding: 3rem;
            max-width: 500px; width: 85%; text-align: center; position: relative;
            transform: scale(0.95) translateY(10px); 
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .modal-overlay.active .character-card { transform: scale(1) translateY(0); }

        /* 档案编号 */
        .file-number {
            position: absolute; top: 15px; left: 20px;
            font-size: 0.7rem; color: #4a3c22; letter-spacing: 0.1rem;
        }

        /* 右上角关闭 */
        .close-btn {
            position: absolute; top: 12px; right: 20px; color: #4a3c22; font-size: 1.5rem; cursor: pointer;
            transition: color 0.3s;
        }
        .close-btn:hover { color: #e8d5b5; }

        /* 角色姓名与头衔 */
        .char-name { font-size: 2rem; color: #e8d5b5; letter-spacing: 0.4rem; margin-bottom: 0.5rem; font-weight: normal; }
        .char-title { 
            font-family: "Courier New", Courier, monospace; /* 这里用打字机字体，更有档案感 */
            font-size: 0.75rem; color: #8a6e3e; letter-spacing: 0.15rem; 
            margin-bottom: 2.5rem; text-transform: uppercase; 
        }
        
        /* 角色台词（打字机打字效果排版） */
        .char-quote { 
            font-size: 1.05rem; color: #a89573; line-height: 1.8; margin-bottom: 3rem; 
            text-align: left; padding-left: 15px; border-left: 1px solid #333; 
            font-family: "Songti SC", serif;
        }

        /* 底部退回按钮 */
        .back-btn {
            display: inline-block;
            font-size: 0.85rem; color: #666; cursor: pointer;
            letter-spacing: 0.15rem; transition: color 0.3s;
            border: 1px solid #222; padding: 8px 15px;
        }
        .back-btn:hover { color: #e8d5b5; border-color: #8a6e3e; background: rgba(138,110,62,0.05); }
    </style>
</head>
<body>

    <!-- 主界面 -->
    <div class="invitation">
        <div class="inner-border">
            <!-- 纯英文水印 -->
            <p class="watermark">P A G E S &nbsp; A N D &nbsp; A S H E S</p>
            
            <div class="divider">✦ ❦ ✦</div>
            
            <div class="main-text">
                致 芥川庄园的贵客：<br>
                昨夜的雷雨已歇，茶点已备好。<br>
                无论您是来找人算账，还是来寻一口热汤。
            </div>

            <div class="btn-group">
                <span class="btn" onclick="openModal('edmund')">拜访账房</span>
                <span class="btn" onclick="openModal('livia')">前往厨房</span>
            </div>
        </div>
    </div>

    <!-- 弹窗层 -->
    <div class="modal-overlay" id="modal">
        <div class="character-card">
            <!-- 档案编号装饰 -->
            <div class="file-number" id="m-file"></div>
            <div class="close-btn" onclick="closeModal()">×</div>
            
            <!-- 角色信息 -->
            <h2 class="char-name" id="m-name"></h2>
            <div class="char-title" id="m-title"></div>
            <div class="char-quote" id="m-quote"></div>
            
            <!-- 退回按钮 -->
            <div class="back-btn" onclick="closeModal()">[ 合上卷宗 ]</div>
        </div>
    </div>

    <script>
        // 角色数据配置
        const characters = {
            edmund: {
                file: "FILE NO. 01 // FINANCE",
                name: "埃德蒙",
                title: "Chief Butler / LSE Alumnus",
                quote: `（账房的门虚掩着，里面传来钢笔划过纸页的沙沙声，他推了推金丝眼镜，笑眯眯地抬头）<br><br>“大小姐，如果是来查账的，请进；如果是来捣乱的，请回。哦对了，如果您是来替莉薇娅小姐讨说法的，那笔预算我已经批了，不用谢。”`
            },
            livia: {
                file: "FILE NO. 02 // KITCHEN",
                name: "莉薇娅",
                title: "Exclusive Maid / Yorkshire",
                quote: `（厨房里弥漫着烤饼干的香气，她正冷着脸擦拭银器，看到你推门，手上的动作顿了一下）<br><br>“您又错过晚饭了。牛奶在炉子上，自己拿，别烫着。还有，别指望我会给您加糖。”`
            }
        };

        function openModal(id) {
            const data = characters[id];
            document.getElementById('m-file').innerText = data.file;
            document.getElementById('m-name').innerText = data.name;
            document.getElementById('m-title').innerText = data.title;
            document.getElementById('m-quote').innerHTML = data.quote;
            
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // 点击遮罩层（非卡片区域）也可以关闭
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
