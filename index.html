<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸页与灰烬 | 芥川庄园</title>
    <style>
        /* === 基础页面 === */
        body {
            margin: 0; padding: 0; background-color: #0a0a0a; color: #c9bda5;
            font-family: Georgia, Garamond, "Noto Serif SC", "Songti SC", serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: 
                radial-gradient(circle at center, #151515 0%, #050505 80%),
                url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.04"/></svg>');
            background-blend-mode: overlay;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>') 2 22, auto;
        }
        
        /* 灰烬飘浮特效 */
        .ash-particle {
            position: fixed; bottom: -10px;
            background: #8a6e3e; 
            border-radius: 50%;
            pointer-events: none; z-index: 5; opacity: 0;
            filter: blur(0.5px);
            animation: floatUp linear forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.2; }
            100% { transform: translateY(-110vh) translateX(20px); opacity: 0; }
        }

        /* 左上角时间温度 */
        .hud-info {
            position: fixed; top: 30px; left: 40px;
            font-family: "Courier New", monospace;
            color: #8a6e3e; font-size: 0.8rem; letter-spacing: 0.15rem;
            pointer-events: none; z-index: 102;
            display: flex; gap: 15px; align-items: center;
        }
        .hud-info span { border-bottom: 1px solid rgba(138, 110, 62, 0.3); padding-bottom: 3px; }
        
        .cursor-trail {
            position: fixed; width: 4px; height: 4px; background: #f5e6c8; border-radius: 50%;
            pointer-events: none; z-index: 9999; box-shadow: 0 0 10px 2px rgba(245, 230, 200, 0.8);
            animation: fadeOutTrail 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes fadeOutTrail { 0% { transform: scale(1) translateY(0); opacity: 1; } 100% { transform: scale(0) translateY(15px); opacity: 0; } }

        /* === 欢迎信封 === */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at center, #1c1c1c 0%, #050505 100%);
            z-index: 100; transition: opacity 1.2s ease, visibility 1.2s ease;
        }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; }

        .envelope {
            background: #151515; border: 1px solid #5a4a2e;
            padding: 4rem 3rem; max-width: 420px; width: 85%; text-align: center;
            position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.9); z-index: 2;
        }
        .envelope::before {
            content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid #2a2213; pointer-events: none;
        }
        .seal {
            width: 60px; height: 60px; border-radius: 50%;
            background: radial-gradient(circle, #4a3c22 0%, #1a140b 100%);
            border: 1px solid #9e8a63; margin: 0 auto 2rem auto;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.5);
        }
        .seal::after { content: '芥'; font-size: 1.4rem; font-weight: bold; color: #b8a57e; font-family: "Songti SC", serif; }

        .env-to { color: #9e8a63; font-size: 0.8rem; letter-spacing: 0.3rem; margin-bottom: 2rem; text-transform: uppercase; font-family: "Courier New", monospace; }
        .env-title { color: #e8d5b5; font-size: 1.8rem; letter-spacing: 0.5rem; margin-bottom: 1.5rem; font-weight: normal; }
        .env-desc { color: #b8a57e; font-size: 0.95rem; line-height: 2.2; letter-spacing: 0.1rem; margin-bottom: 3rem; font-style: italic; }
        
        .open-btn {
            display: inline-block; padding: 12px 30px; border: 1px solid #5a4a2e;
            color: #e8d5b5; font-size: 0.9rem; letter-spacing: 0.2rem; cursor: pointer;
            background: transparent; transition: all 0.4s ease; text-decoration: none;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .open-btn:hover { color: #fff; border-color: #9e8a63; background: rgba(158,138,99,0.1); box-shadow: 0 0 20px rgba(158,138,99,0.2); }
        .env-footer { margin-top: 3rem; font-size: 0.75rem; color: #5a4a2e; letter-spacing: 0.1rem; font-family: "Courier New", monospace; }

        /* === 主界面 === */
        #main-screen {
            position: absolute; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transform: translateY(20px); pointer-events: none;
            transition: opacity 1.5s ease, transform 1.5s ease;
            z-index: 10;
        }
        #welcome-screen.hidden + #main-screen { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .invitation {
            border: 1px solid #5a4a2e; padding: 3rem 3rem; max-width: 480px; width: 85%; text-align: center;
            position: relative; background: rgba(30, 30, 30, 0.85); z-index: 1; transition: all 0.6s ease;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
        }
        .invitation:hover { border-color: #9e8a63; box-shadow: 0 15px 50px rgba(0,0,0,0.9), 0 0 25px rgba(158,138,99,0.2); }
        
        .inner-border { border: 1px dashed #5a4a2e; padding: 2.5rem 1rem; display: flex; flex-direction: column; align-items: center; transition: border-color 0.6s ease; }
        .invitation:hover .inner-border { border-color: #8a6e3e; }

        .watermark { display: flex; justify-content: space-between; width: 80%; margin-top: 0; margin-bottom: 3rem; transition: color 0.6s ease; }
        .watermark span { color: #6b5a3e; font-size: 0.7rem; letter-spacing: 0.3rem; text-transform: uppercase; font-family: "Courier New", monospace; }
        .invitation:hover .watermark span { color: #b8a57e; }
        
        .main-text { color: #e0d0b0; font-size: 0.95rem; line-height: 2.2; letter-spacing: 0.1rem; margin-bottom: 2.5rem; }
        
        .btn-group { display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center; }
        .btn {
            position: relative; display: flex; justify-content: space-between; align-items: center;
            width: 85%; padding: 14px 20px; border: 1px solid #5a4a2e; color: #e8d5b5; transition: all 0.4s ease; 
            font-size: 0.95rem; letter-spacing: 0.15rem; background: rgba(255,255,255,0.03); overflow: hidden;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .btn::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px; background-color: #f5e6c8; transform: scaleY(0); transition: transform 0.3s ease; }
        .btn:hover { color: #fff; border-color: #9e8a63; background: rgba(158,138,99,0.1); padding-left: 25px; box-shadow: 0 0 20px rgba(158,138,99,0.2); }
        .btn:hover::before { transform: scaleY(1); } 
        .btn .num { color: #9e8a63; font-size: 0.8rem; font-family: "Courier New", monospace; transition: color 0.3s; }
        .btn:hover .num { color: #fff; }

        .reread-divider { width: 60%; border-top: 1px dashed #3a3024; margin: 2rem 0 1rem 0; }
        .reread-btn { font-size: 0.85rem; color: #8a6e3e; letter-spacing: 0.2rem; text-decoration: none; transition: all 0.3s; padding: 5px; cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important; }
        .reread-btn:hover { color: #f5e6c8; text-shadow: 0 0 10px rgba(245,230,200,0.3); }

        .leave-manor-btn {
            position: fixed; top: 30px; right: 40px; display: flex; align-items: center; gap: 8px;
            padding: 10px 24px; color: #e8d5b5; font-size: 0.85rem; letter-spacing: 0.2rem;
            border: 1px solid #5a4a2e; background: rgba(30, 30, 30, 0.8);
            border-radius: 4px; cursor: pointer; z-index: 102; transition: all 0.3s ease;
            animation: pulseBorder 2.5s infinite alternate;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        @keyframes pulseBorder { 0% { border-color: #5a4a2e; box-shadow: 0 0 5px rgba(158,138,99,0.1); } 100% { border-color: #9e8a63; box-shadow: 0 0 15px rgba(158,138,99,0.4); } }
        .leave-manor-btn:hover { color: #fff; border-color: #f5e6c8; background: rgba(158,138,99,0.2); box-shadow: 0 0 20px rgba(245, 230, 200, 0.4); animation: none; }

        /* === 弹窗 === */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 200;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .character-card {
            background: #1a1a1a; border: 1px solid #9e8a63; padding: 3rem 2.5rem; max-width: 480px; width: 85%; text-align: center; position: relative;
            transform: scale(0.95) translateY(15px); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 70px rgba(0,0,0,0.95), 0 0 40px rgba(158,138,99,0.2);
        }
        .modal-overlay.active .character-card { transform: scale(1) translateY(0); }

        .file-number { position: absolute; top: 15px; left: 20px; font-size: 0.75rem; color: #9e8a63; letter-spacing: 0.15rem; font-family: "Courier New", monospace; }
        .close-btn { position: absolute; top: 12px; right: 20px; color: #9e8a63; font-size: 1.5rem; transition: color 0.3s; cursor: pointer; }
        .close-btn:hover { color: #fff; }

        .char-name { font-size: 2rem; color: #f5e6c8; letter-spacing: 0.4rem; margin-bottom: 0.5rem; font-weight: normal; }
        .char-title { font-family: "Courier New", Courier, monospace; font-size: 0.75rem; color: #c9bda5; letter-spacing: 0.15rem; margin-bottom: 2.5rem; text-transform: uppercase; }
        
        .char-content-box {
            font-size: 1.05rem; color: #d1c5a8; line-height: 2.2; margin-bottom: 2rem; 
            text-align: justify; padding-left: 15px; border-left: 2px solid #5a4a2e;
            max-height: 300px; overflow-y: auto; transition: opacity 0.3s ease;
            letter-spacing: 0.05rem;
        }
        .char-content-box::-webkit-scrollbar { width: 4px; }
        .char-content-box::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .char-content-box::-webkit-scrollbar-thumb { background: #5a4a2e; border-radius: 2px; }
        .char-content-box::-webkit-scrollbar-thumb:hover { background: #9e8a63; }

        .story-p { text-indent: 2em; margin-bottom: 1rem; }

        .card-actions { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .action-btn {
            display: inline-block; font-size: 0.85rem; letter-spacing: 0.15rem; transition: all 0.3s; padding: 10px 20px; text-decoration: none; cursor: pointer;
            color: #9e8a63; border: 1px solid #5a4a2e; background: transparent;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .action-btn:hover { color: #fff; border-color: #8a6e3e; background: rgba(158,138,99,0.1); box-shadow: 0 0 15px rgba(158,138,99,0.2); }
        .action-btn.primary { background: rgba(158,138,99,0.2); color: #fff; border-color: #9e8a63; }
        .action-btn.primary:hover { background: rgba(158,138,99,0.4); }

    </style>
</head>
<body>
    <div class="hud-info">
        <span id="current-time">00:00</span>
        <span>13°C 阴雨</span>
    </div>

    <div id="welcome-screen">
        <div class="envelope">
            <div class="seal"></div>
            <div class="env-to">To the Esteemed Guest</div>
            <div class="env-title">纸页与灰烬</div>
            <div class="env-desc">
                在这座被雷雨与旧火包围的庄园里，<br>
                纸页正在泛黄，灰烬仍有温热。<br>
                请在此落款，或推开这扇尘封的门。
            </div>
            <a href="javascript:void(0);" onclick="goToPrologue()" class="open-btn">[ 拆 开 信 件 ]</a>
            <div class="env-footer">From Akutagawa Manor</div>
        </div>
    </div>

    <div id="main-screen">
        <div class="leave-manor-btn" onclick="leaveManor()">
            <span style="font-size: 1rem;">⎋</span> [ 离 开 庄 园 ]
        </div>

        <div class="invitation">
            <div class="inner-border">
                <div class="watermark">
                    <span>P A G E S</span><span>A N D</span><span>A S H E S</span>
                </div>
                
                <div class="main-text">
                    致 芥川庄园的贵客：<br>
                    昨夜的雷雨已歇，茶点已备好。<br>
                    请选择您要翻阅的档案。
                </div>

                <div class="btn-group">
                    <span class="btn" onclick="openModal('edmund')">
                        <span>拜访账房</span><span class="num">[ 01 ]</span>
                    </span>
                    <span class="btn" onclick="openModal('livia')">
                        <span>前往厨房</span><span class="num">[ 02 ]</span>
                    </span>
                    <span class="btn" onclick="openModal('shizuku')">
                        <span>探访研究室</span><span class="num">[ 03 ]</span>
                    </span>
                </div>

                <div class="reread-divider"></div>
                <a href="prologue.html" class="reread-btn">[ 重温那个雷雨之夜 ]</a>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="character-card">
            <div class="file-number" id="m-file"></div>
            <div class="close-btn" onclick="closeModal()">×</div>
            
            <h2 class="char-name" id="m-name"></h2>
            <div class="char-title" id="m-title"></div>
            
            <div class="char-content-box" id="m-content"></div>
            
            <div class="card-actions">
                <!-- 换成“放回书架”的音效 -->
                <span class="action-btn" onclick="playBookOnShelfSound(); closeModal();">[ 合上卷宗 ]</span>
                <span class="action-btn primary" id="btn-toggle-story" onclick="toggleStory()"></span>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 👇 音效：把卷宗放回书架（摩擦 + 撞击 + 余音）
        // ==========================================
        function playBookOnShelfSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;

                // 1. 摩擦声
                const slideBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
                const slideData = slideBuffer.getChannelData(0);
                for (let i = 0; i < slideData.length; i++) { slideData[i] = Math.random() * 2 - 1; }
                const slideSource = audioCtx.createBufferSource();
                slideSource.buffer = slideBuffer;
                const slide
