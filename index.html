<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸页与灰烬 | 芥川庄园</title>
    <style>
        /* === 基础页面 === */
        body {
            margin: 0; padding: 0; background-color: #121212; color: #e8d5b5;
            font-family: "Songti SC", "Noto Serif SC", serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at center, #2a2a2a 0%, #111 80%);
            overflow: hidden;
            
            /* 🖋️ 极简羽毛笔光标 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23e8d5b5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>') 2 22, auto;
        }
        
        /* === 鼠标拖尾光效粒子 === */
        .cursor-trail {
            position: fixed;
            width: 4px; height: 4px;
            background: #f5e6c8;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 10px 2px rgba(245, 230, 200, 0.8);
            animation: fadeOutTrail 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fadeOutTrail {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(0) translateY(15px); opacity: 0; }
        }

        /* === 邀请函主界面 === */
        .invitation {
            border: 1px solid #4a3c22; padding: 3rem 3rem; max-width: 480px; width: 85%; text-align: center;
            position: relative; background: rgba(26, 26, 26, 0.85); z-index: 1;
            transition: all 0.6s ease;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
        }
        .invitation:hover { border-color: #8a6e3e; box-shadow: 0 15px 50px rgba(0,0,0,0.9), 0 0 20px rgba(138,110,62,0.15); }
        
        .inner-border {
            border: 1px dashed #4a3c22; padding: 2.5rem 1rem;
            display: flex; flex-direction: column; align-items: center;
            transition: border-color 0.6s ease;
        }
        .invitation:hover .inner-border { border-color: #6b5a3e; }

        /* === 独特排版：诗意错落的英文水印 === */
        .watermark-container {
            width: 100%;
            margin-top: 0;
            margin-bottom: 3.5rem;
            padding: 0 2rem; /* 给左右留出呼吸空间 */
        }
        /* 第一行 */
        .w-row-1 {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 1.5rem; /* PAGES 和 AND 的间距 */
        }
        /* 第二行 */
        .w-row-2 {
            text-align: right;
            margin-top: 0.5rem;
            padding-right: 2rem; /* 往左收一点，显得更错落 */
        }
        
        /* 英文文字基础样式 */
        .w-text {
            color: #8a6e3e;
            font-size: 0.75rem;
            letter-spacing: 0.5rem;
            transition: color 0.6s ease;
            text-transform: uppercase;
        }
        /* AND 字号更小一点 */
        .w-small {
            font-size: 0.6rem;
            letter-spacing: 0.4rem;
            color: #6b5a3e;
        }

        .invitation:hover .w-text { color: #e8d5b5; }
        .invitation:hover .w-small { color: #8a6e3e; }
        
        /* 正文文字 */
        .main-text { 
            color: #d1c5a8; font-size: 1rem; line-height: 2.2; 
            letter-spacing: 0.15rem; margin-bottom: 3rem; 
        }
        
        /* === 档案目录式按钮 === */
        .btn-group { 
            display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center; 
        }
        .btn {
            position: relative;
            display: flex; justify-content: space-between; align-items: center;
            width: 85%; padding: 14px 20px; border: 1px solid #4a3c22;
            color: #e8d5b5; transition: all 0.4s ease; 
            font-size: 0.95rem; letter-spacing: 0.15rem;
            background: rgba(255,255,255,0.03);
            overflow: hidden;
            /* 🔍 放大镜光标 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23e8d5b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        
        .btn::before {
            content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px;
            background-color: #f5e6c8; transform: scaleY(0); transition: transform 0.3s ease;
        }
        
        .btn:hover { 
            color: #fff; border-color: #8a6e3e; background: rgba(138,110,62,0.1); 
            padding-left: 25px; box-shadow: 0 0 20px rgba(138,110,62,0.2);
        }
        .btn:hover::before { transform: scaleY(1); } 

        .btn .num { 
            color: #8a6e3e; font-size: 0.8rem; font-family: "Courier New", monospace; 
            transition: color 0.3s;
        }
        .btn:hover .num { color: #fff; }

        /* === 弹窗背景遮罩 === */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 10;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        /* === 角色专属档案卡 === */
        .character-card {
            background: #1a1a1a; border: 1px solid #8a6e3e; padding: 3rem 2.5rem;
            max-width: 480px; width: 85%; text-align: center; position: relative;
            transform: scale(0.95) translateY(15px); 
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 70px rgba(0,0,0,0.95), 0 0 40px rgba(138,110,62,0.15);
        }
        .modal-overlay.active .character-card { transform: scale(1) translateY(0); }

        .file-number { position: absolute; top: 15px; left: 20px; font-size: 0.75rem; color: #8a6e3e; letter-spacing: 0.15rem; font-family: "Courier New", monospace; }
        
        .close-btn { 
            position: absolute; top: 12px; right: 20px; color: #8a6e3e; font-size: 1.5rem; transition: color 0.3s; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23e8d5b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .close-btn:hover { color: #f5e6c8; }

        .char-name { font-size: 2rem; color: #f5e6c8; letter-spacing: 0.4rem; margin-bottom: 0.5rem; font-weight: normal; }
        .char-title { 
            font-family: "Courier New", Courier, monospace; font-size: 0.75rem; color: #b8a57e; 
            letter-spacing: 0.15rem; margin-bottom: 2.5rem; text-transform: uppercase; 
        }
        .char-quote { 
            font-size: 1rem; color: #e8d5b5; line-height: 1.9; margin-bottom: 3rem; 
            text-align: left; padding-left: 15px; border-left: 2px solid #4a3c22; 
        }
        
        .back-btn {
            display: inline-block; font-size: 0.8rem; color: #b8a57e;
            letter-spacing: 0.15rem; transition: all 0.3s; border: 1px solid #4a3c22; padding: 8px 20px;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23e8d5b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .back-btn:hover { color: #fff; border-color: #8a6e3e; background: rgba(138,110,62,0.15); }
    </style>
</head>
<body>

    <!-- 主界面 -->
    <div class="invitation">
        <div class="inner-border">
            
            <!-- 按照你的要求重排的英文水印 -->
            <div class="watermark-container">
                <div class="w-row-1">
                    <span class="w-text">P A G E S</span>
                    <span class="w-text w-small">A N D</span>
                </div>
                <div class="w-row-2">
                    <span class="w-text">A S H E S</span>
                </div>
            </div>
            
            <div class="main-text">
                致 芥川庄园的贵客：<br>
                昨夜的雷雨已歇，茶点已备好。<br>
                请选择您要翻阅的档案。
            </div>

            <div class="btn-group">
                <span class="btn" onclick="openModal('edmund')">
                    <span>拜访账房</span>
                    <span class="num">[ 01 ]</span>
                </span>
                <span class="btn" onclick="openModal('livia')">
                    <span>前往厨房</span>
                    <span class="num">[ 02 ]</span>
                </span>
                <span class="btn" onclick="openModal('shizuku')">
                    <span>探访研究室</span>
                    <span class="num">[ 03 ]</span>
                </span>
            </div>
        </div>
    </div>

    <!-- 弹窗层 -->
    <div class="modal-overlay" id="modal">
        <div class="character-card">
            <div class="file-number" id="m-file"></div>
            <div class="close-btn" onclick="closeModal()">×</div>
            
            <h2 class="char-name" id="m-name"></h2>
            <div class="char-title" id="m-title"></div>
            <div class="char-quote" id="m-quote"></div>
            
            <div class="back-btn" onclick="closeModal()">[ 合上卷宗 ]</div>
        </div>
    </div>

    <script>
        // === 鼠标拖尾光效 JS 逻辑 ===
        let lastTrailTime = 0;
        document.addEventListener('mousemove', function(e) {
            const now = Date.now();
            if (now - lastTrailTime > 30) {
                createParticle(e.clientX, e.clientY);
                lastTrailTime = now;
            }
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'cursor-trail';
            
            const offsetX = (Math.random() - 0.5) * 8;
            const offsetY = (Math.random() - 0.5) * 8;
            
            particle.style.left = (x + offsetX) + 'px';
            particle.style.top = (y + offsetY) + 'px';
            
            const size = Math.random() * 4 + 2; 
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 800);
        }

        // === 角色数据库 ===
        const characters = {
            edmund: {
                file: "FILE NO. 01 // FINANCE",
                name: "埃德蒙",
                title: "Chief Butler / LSE Alumnus",
                quote: `（账房的门虚掩着，里面传来钢笔划过纸页的沙沙声，他推了推金丝眼镜，笑眯眯地抬头）<br><br>“大小姐，如果是来查账的，请进；如果是来捣乱的，请回。哦对了，如果您是来替莉薇娅小姐讨说法的，那笔预算我已经批了，不用谢。”`
            },
            livia: {
                file: "FILE NO. 02 // KITCHEN",
                name: "莉薇娅",
                title: "Exclusive Maid / Yorkshire",
                quote: `（厨房里弥漫着烤饼干的香气，她正冷着脸擦拭银器，看到你推门，手上的动作顿了一下）<br><br>“您又错过晚饭了。牛奶在炉子上，自己拿，别烫着。还有，别指望我会给您加糖。”`
            },
            shizuku: {
                file: "FILE NO. 03 // RESEARCH",
                name: "星野雫",
                title: "Resident Researcher / Tech Advisor",
                quote: `（研究室里散落着精密的零件和图纸，他正对着模型计算，听到门响，他立刻停下手里的活，长发下的眉眼弯了弯，笑得温和）<br><br>“大小姐，实验数据刚好记录完。红茶和刚烤好的饼干在桌上，您先坐。如果是关于飞机的驾驶问题，或者庄园的技术维护，我随时可以。但如果是埃德蒙先生让您来劝我……换上那套衣服的，请容我礼貌地拒绝。”`
            }
        };

        function openModal(id) {
            const data = characters[id];
            document.getElementById('m-file').innerText = data.file;
            document.getElementById('m-name').innerText = data.name;
            document.getElementById('m-title').innerText = data.title;
            document.getElementById('m-quote').innerHTML = data.quote;
            
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
