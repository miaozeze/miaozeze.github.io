<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芥川庄园</title>
    <style>
        /* 页面基础设置 */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* 纯黑背景 */
            color: #d1d1d1; /* 柔和的灰白色文字 */
            font-family: "Songti SC", "Noto Serif SC", "SimSun", serif; /* 极简古典衬线体 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* 主文案 */
        .text-line {
            font-size: 1.2rem;
            letter-spacing: 0.4rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        /* 按钮/链接样式 */
        .enter-btn {
            font-size: 0.9rem;
            letter-spacing: 0.2rem;
            color: #666;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 10px;
        }

        /* 悬停变亮 */
        .enter-btn:hover {
            color: #fff;
        }

        /* 底部极暗小字 */
        .footer-hint {
            position: absolute;
            bottom: 2rem;
            font-size: 0.6rem;
            color: #222;
            letter-spacing: 0.1rem;
        }
    </style>
</head>
<body>

    <!-- 文案部分 -->
    <div class="text-line">规矩、阴雨与长夜。</div>

    <!-- 按钮部分：之后你可以把 href="#" 换成你真正的聊天页面链接 -->
    <a href="#" class="enter-btn">[ 推 开 门 ]</a>

    <!-- 底部装饰小字 -->
    <div class="footer-hint">Welcome to the manor.</div>

</body>
</html>
