<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸页与灰烬 | 芥川庄园</title>
    <style>
        /* === 1. 自定义羽毛笔鼠标指针 === */
        body {
            margin: 0; padding: 0; background-color: #0a0a0a; color: #d1c5a8;
            font-family: "Songti SC", "Noto Serif SC", serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #050505 70%);
            overflow: hidden;
            
            /* 使用 SVG 绘制一个金色的羽毛笔作为鼠标指针 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23e8d5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3v12l-9 9-9-9V3h18z"/><path d="M3 3l9 9 9-9"/><path d="M12 12v9"/></svg>') 0 0, auto;
        }

        /* 可选：当鼠标悬停在按钮上时，变成“查看”的小手 */
        .btn, .back-btn, .close-btn {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23e8d5b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 12 12, pointer !important;
        }

        /* === 2. 鼠标跟随的微弱聚光灯（煤油灯效果） === */
        #cursor-glow {
            position: fixed;
            top: 0; left: 0;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(232, 213, 181, 0.05) 0%, transparent 60%);
            pointer-events: none; /* 防止遮挡点击事件 */
            transform: translate(-50%, -50%);
            z-index: 0;
            transition: opacity 0.3s;
        }
        
        /* === 邀请函主界面 === */
        .invitation {
            border: 1px solid #3a3024; padding: 3rem 3rem; max-width: 480px; width: 85%; text-align: center;
            position: relative; background: rgba(10, 10, 10, 0.85); z-index: 1;
            transition: all 0.6s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .invitation:hover { border-color: #6b5a3e; }
        
        .inner-border {
            border: 1px dashed #3a3024; padding: 2.5rem 1rem;
            display: flex; flex-direction: column; align-items: center;
            transition: border-color 0.6s ease;
        }
        .invitation:hover .inner-border { border-color: #5a4a2e; }

        .watermark {
            letter-spacing: 0.5rem; color: #6b5a3e; font-size: 0.7rem; 
            margin-top: 0; margin-bottom: 3rem; text-transform: uppercase;
            transition: color 0.6s ease; white-space: nowrap;
        }
        .invitation:hover .watermark { color: #9e8a63; }
        
        .main-text { 
            color: #b8a57e; font-size: 0.95rem; line-height: 2.2; 
            letter-spacing: 0.15rem; margin-bottom: 3rem; 
        }
        
        .btn-group { 
            display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center; 
        }
        .btn {
            position: relative;
            display: flex; justify-content: space-between; align-items: center;
            width: 85%; padding: 14px 20px; border: 1px solid #3a3024;
            color: #d1c5a8; transition: all 0.4s ease; 
            font-size: 0.95rem; letter-spacing: 0.15rem;
            background: rgba(255,255,255,0.02);
            overflow: hidden;
        }
        
        .btn::before {
            content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px;
            background-color: #e8d5b5; transform: scaleY(0); transition: transform 0.3s ease;
        }
        
        .btn:hover { 
            color: #fff; border-color: #6b5a3e; background: rgba(138,110,62,0.08); 
            padding-left: 25px; box-shadow: 0 0 15px rgba(138,110,62,0.15);
        }
        .btn:hover::before { transform: scaleY(1); } 

        .btn .num { 
            color: #6b5a3e; font-size: 0.8rem; font-family: "Courier New", monospace; 
            transition: color 0.3s;
        }
        .btn:hover .num { color: #e8d5b5; }

        /* === 弹窗背景遮罩 === */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 10;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        /* === 角色专属档案卡 === */
        .character-card {
            background: #111; border: 1px solid #6b5a3e; padding: 3rem 2.5rem;
            max-width: 480px; width: 85%; text-align: center; position: relative;
            transform: scale(0.95) translateY(15px); 
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 60px rgba(0,0,0,0.95), 0 0 30px rgba(138,110,62,0.1);
        }
        .modal-overlay.active .character-card { transform: scale(1) translateY(0); }

        .file-number { position: absolute; top: 15px; left: 20px; font-size: 0.75rem; color: #6b5a3e; letter-spacing: 0.15rem; font-family: "Courier New", monospace; }
        .close-btn { position: absolute; top: 12px; right: 20px; color: #6b5a3e; font-size: 1.5rem; transition: color 0.3s; }
        .close-btn:hover { color: #e8d5b5; }

        .char-name { font-size: 2rem; color: #e8d5b5; letter-spacing: 0.4rem; margin-bottom: 0.5rem; font-weight: normal; }
        .char-title { 
            font-family: "Courier New", Courier, monospace; font-size: 0.75rem; color: #9e8a63; 
            letter-spacing: 0.15rem; margin-bottom: 2.5rem; text-transform: uppercase; 
        }
        .char-quote { 
            font-size: 1rem; color: #c9bda5; line-height: 1.9; margin-bottom: 3rem; 
            text-align: left; padding-left: 15px; border-left: 2px solid #3a3024; 
        }
        .back-btn {
            display: inline-block; font-size: 0.8rem; color: #9e8a63;
            letter-spacing: 0.15rem; transition: all 0.3s; border: 1px solid #3a3024; padding: 8px 20px;
        }
        .back-btn:hover { color: #fff; border-color: #8a6e3e; background: rgba(138,110,62,0.1); }
    </style>
</head>
<body>

    <!-- 鼠标跟随的光晕 -->
    <div id="cursor-glow"></div>

    <!-- 主界面 -->
    <div class="invitation">
        <div class="inner-border">
            <p class="watermark">P A G E S &nbsp; A N D &nbsp; A S H E S</p>
            
            <div class="main-text">
                致 芥川庄园的贵客：<br>
                昨夜的雷雨已歇，茶点已备好。<br>
                请选择您要翻阅的档案。
            </div>

            <div class="btn-group">
                <span class="btn" onclick="openModal('edmund')">
                    <span>拜访账房</span>
                    <span class="num">[ 01 ]</span>
                </span>
                <span class="btn" onclick="openModal('livia')">
                    <span>前往厨房</span>
                    <span class="num">[ 02 ]</span>
                </span>
                <span class="btn" onclick="openModal('shizuku')">
                    <span>探访研究室</span>
                    <span class="num">[ 03 ]</span>
                </span>
            </div>
        </div>
    </div>

    <!-- 弹窗层 -->
    <div class="modal-overlay" id="modal">
        <div class="character-card">
            <div class="file-number" id="m-file"></div>
            <div class="close-btn" onclick="closeModal()">×</div>
            
            <h2 class="char-name" id="m-name"></h2>
            <div class="char-title" id="m-title"></div>
            <div class="char-quote" id="m-quote"></div>
            
            <div class="back-btn" onclick="closeModal()">[ 合上卷宗 ]</div>
        </div>
    </div>

    <script>
        // === 鼠标跟随光晕的 JS 逻辑 ===
        const glow = document.getElementById('cursor-glow');
        
        document.addEventListener('mousemove', (e) => {
            // 让光晕平滑跟随鼠标
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // 鼠标移出窗口时隐藏光晕
        document.addEventListener('mouseleave', () => { glow.style.opacity = '0'; });
        document.addEventListener('mouseenter', () => { glow.style.opacity = '1'; });


        // === 弹窗逻辑 ===
        const characters = {
            edmund: {
                file: "FILE NO. 01 // FINANCE",
                name: "埃德蒙",
                title: "Chief Butler / LSE Alumnus",
                quote: `（账房的门虚掩着，里面传来钢笔划过纸页的沙沙声，他推了推金丝眼镜，笑眯眯地抬头）<br><br>“大小姐，如果是来查账的，请进；如果是来捣乱的，请回。哦对了，如果您是来替莉薇娅小姐讨说法的，那笔预算我已经批了，不用谢。”`
            },
            livia: {
                file: "FILE NO. 02 // KITCHEN",
                name: "莉薇娅",
                title: "Exclusive Maid / Yorkshire",
                quote: `（厨房里弥漫着烤饼干的香气，她正冷着脸擦拭银器，看到你推门，手上的动作顿了一下）<br><br>“您又错过晚饭了。牛奶在炉子上，自己拿，别烫着。还有，别指望我会给您加糖。”`
            },
            shizuku: {
                file: "FILE NO. 03 // RESEARCH",
                name: "星野雫",
                title: "Resident Researcher / Tech Advisor",
                quote: `（研究室里散落着精密的零件和图纸，他正对着模型计算，听到门响，他立刻停下手里的活，长发下的眉眼弯了弯，笑得温和）<br><br>“大小姐，实验数据刚好记录完。红茶和刚烤好的饼干在桌上，您先坐。如果是关于飞机的驾驶问题，或者庄园的技术维护，我随时可以。但如果是埃德蒙先生让您来劝我……换上那套衣服的，请容我礼貌地拒绝。”`
            }
        };

        function openModal(id) {
            const data = characters[id];
            document.getElementById('m-file').innerText = data.file;
            document.getElementById('m-name').innerText = data.name;
            document.getElementById('m-title').innerText = data.title;
            document.getElementById('m-quote').innerHTML = data.quote;
            
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) { closeModal(); }
        });
    </script>
</body>
</html>
