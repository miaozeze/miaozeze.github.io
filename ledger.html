<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>厨房 | 纸页与灰烬</title>
    <style>
        /* === 基础页面 === */
        body {
            margin: 0; padding: 0; background-color: #0a0a0a; color: #c9bda5;
            font-family: Georgia, Garamond, "Noto Serif SC", "Songti SC", serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 50% 30%, #151515 0%, #050505 70%);
            overflow: hidden; -webkit-font-smoothing: antialiased;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>') 2 22, auto;
        }

        .hud-info {
            position: fixed; top: 30px; left: 40px; font-family: "Courier New", monospace;
            color: #8a6e3e; font-size: 0.8rem; letter-spacing: 0.15rem; z-index: 102;
            display: flex; gap: 15px;
        }
        .hud-info span { padding-bottom: 3px; border-bottom: 1px solid rgba(138, 110, 62, 0.3); }

        .back-btn {
            position: fixed; top: 30px; right: 40px; padding: 10px 24px; color: #e8d5b5; font-size: 0.85rem; letter-spacing: 0.2rem;
            border: 1px solid #5a4a2e; background: rgba(30, 30, 30, 0.8); border-radius: 4px; text-decoration: none; z-index: 102; transition: all 0.3s ease;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .back-btn:hover { color: #fff; border-color: #9e8a63; background: rgba(158,138,99,0.2); }

        /* 鼠标拖尾 */
        .cursor-trail {
            position: fixed; width: 4px; height: 4px; background: #f5e6c8; border-radius: 50%;
            pointer-events: none; z-index: 9999; box-shadow: 0 0 10px 2px rgba(245, 230, 200, 0.8);
            animation: fadeOutTrail 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes fadeOutTrail { 0% { transform: scale(1) translateY(0); opacity: 1; } 100% { transform: scale(0) translateY(15px); opacity: 0; } }

        /* === 核心布局 === */
        .layout {
            display: flex; width: 95%; max-width: 1280px; height: 85vh; gap: 40px;
        }

        /* 左侧导航 */
        .sidebar {
            width: 240px; display: flex; flex-direction: column; justify-content: center;
            border-right: 1px solid rgba(90, 74, 46, 0.3); padding-right: 40px;
            position: relative; flex-shrink: 0;
        }
        .room-name { font-size: 3rem; color: #f5e6c8; margin: 0 0 0.5rem 0; font-weight: normal; letter-spacing: 0.2rem; }
        .room-desc { font-family: "Courier New", monospace; font-size: 0.75rem; color: #8a6e3e; letter-spacing: 0.15rem; text-transform: uppercase; margin-bottom: 4rem; }
        .nav-list { display: flex; flex-direction: column; gap: 20px; }
        .nav-item {
            font-size: 1rem; color: #8a6e3e; letter-spacing: 0.15rem; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .nav-item::before { content: '—'; color: transparent; transition: color 0.3s; }
        .nav-item:hover, .nav-item.active { color: #f5e6c8; padding-left: 10px; }
        .nav-item:hover::before, .nav-item.active::before { color: #f5e6c8; }

        /* 右侧内容 */
        .content-area { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 2rem 0; position: relative; }
        .text-box {
            max-height: 75vh; overflow-y: auto; padding-right: 20px; font-family: "Songti SC", "Noto Serif SC", serif;
            font-size: 1.1rem; color: #d1c5a8; line-height: 2.2; text-align: justify; letter-spacing: 0.05rem;
            opacity: 0; transition: opacity 0.4s ease;
        }
        .text-box::-webkit-scrollbar { display: none; }
        .text-box.show { opacity: 1; }

        /* ==========================================
           01 / 语录宽幅图片
           ========================================== */
        .quote-image-wrapper {
            width: 100%; max-width: 600px; margin: 0 auto 2.5rem auto;
            background: #12100d; border: 2px solid #6e5a3a; padding: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 15px 15px -10px rgba(158, 138, 99, 0.1);
        }
        .quote-image-wrapper img {
            width: 100%; height: 240px; object-fit: cover; object-position: center;
            filter: sepia(40%) grayscale(30%) brightness(0.7); display: block;
        }
        .quote-image-caption {
            text-align: center; font-family: "Courier New", monospace; font-size: 0.75rem;
            color: #8a6e3e; margin-top: 10px; letter-spacing: 0.15rem;
        }
        .quote-style {
            font-style: italic; font-size: 1.25rem; color: #e8d5b5; line-height: 2.2; text-indent: 2em;
            padding: 1.5rem 2rem; background: rgba(20,20,20,0.4); border-left: 2px solid #5a4a2e;
        }

        /* ==========================================
           03 / 专属食单（杂志封面排版：全高图 + 垂直居中文字）
           ========================================== */
        .kitchen-split-view {
            display: flex;
            width: 100%;
            max-width: 1050px;
            height: 70vh;
            max-height: 600px;
            margin: 0 auto;
            gap: 25px;
        }

        /* 左侧：点菜单 */
        .menu-ticket-wrapper {
            width: 250px;
            flex-shrink: 0;
            background: #14110d;
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid #2a2015;
            position: relative;
        }
        .menu-ticket-wrapper::before {
            content: ''; position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 40px; height: 25px; background: linear-gradient(to bottom, #d0d0d0, #505050);
            border-radius: 4px 4px 8px 8px; z-index: 10;
            box-shadow: 0 5px 10px rgba(0,0,0,0.8), inset 0 2px 2px rgba(255,255,255,0.5);
            clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
        }
        .menu-ticket {
            background: #1c1a17;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.08"/></svg>');
            border: 1px solid #3a3024;
            padding: 20px 15px;
            height: 100%;
            box-sizing: border-box;
            color: #a89573;
            font-family: "Courier New", monospace;
        }
        .slip-header { display: flex; justify-content: space-between; border-bottom: 2px dashed #3a3024; padding-bottom: 12px; margin-bottom: 15px; font-size: 0.7rem; letter-spacing: 0.1rem; }
        .slip-header span { color: #b85c58; }
        .slip-cols { display: flex; font-size: 0.65rem; color: #5a4a2e; border-bottom: 1px solid #3a3024; padding-bottom: 6px; margin-bottom: 10px; }
        .col-qty { width: 35px; }
        .col-dish { flex: 1; }
        .slip-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px dotted #2a2218; cursor: pointer; transition: all 0.3s; font-size: 0.9rem; }
        .slip-item:hover { background: rgba(158,138,99,0.05); padding-left: 5px; }
        .slip-item.active { color: #f5e6c8; }
        .slip-item.active .col-qty { color: #b85c58; font-weight: bold; }
        .checkbox { display: inline-block; width: 12px; height: 12px; border: 1px solid #5a4a2e; margin-right: 8px; position: relative; top: 1px; transition: all 0.3s; }
        .slip-item.active .checkbox { background: #b85c58; border-color: #b85c58; }
        .slip-item.active .checkbox::after { content: '✓'; color: #1c1a17; position: absolute; top: -4px; left: 0px; font-size: 11px; font-weight: bold; }

        /* 右侧：档案面板 */
        .recipe-panel-wrapper {
            flex: 1;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid #3a3024;
            border-radius: 6px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
            padding: 0; /* 移除 padding，以便图片贴边 */
            display: flex;
            overflow: hidden;
        }
        .recipe-panel-wrapper::before {
            content: ''; position: absolute; top: 30px; bottom: 30px; left: 0; width: 3px; background: #b85c58; z-index: 10;
        }

        /* 杂志封面排版核心：左图 + 右字 */
        .editorial-cover {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 左侧全高图片 */
        .cover-image-left {
            width: 42%; /* 图片宽度 */
            height: 100%;
            position: relative;
            flex-shrink: 0;
            border-right: 1px solid #3a3024;
        }
        .cover-image-left img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(30%) contrast(1.1) brightness(0.85);
            display: block;
        }
        .cover-image-caption {
            position: absolute; bottom: 20px; left: 20px;
            font-family: "Courier New", monospace; font-size: 0.75rem; color: #d1c5a8;
            background: rgba(10,10,10,0.7); padding: 4px 8px; letter-spacing: 0.1rem;
            border-left: 2px solid #b85c58;
        }

        /* 右侧文字区 */
        .cover-text-right {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center; /* 垂直居中，解决字少留白问题 */
        }

        .panel-title {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 1.7rem; /* 调整字号，确保不换行 */
            color: #f5e6c8; margin: 0 0 5px 0; font-weight: normal;
            white-space: nowrap; /* 强制不换行 */
            overflow: hidden;
            text-overflow: ellipsis; /* 超长省略 */
        }
        .panel-no {
            font-family: "Courier New", monospace; font-size: 0.8rem; color: #b85c58;
            letter-spacing: 0.15rem; margin-bottom: 25px; border-bottom: 1px dashed #3a3024; padding-bottom: 10px;
        }

        .sec-title {
            font-family: "Courier New", monospace; font-size: 0.85rem; color: #8a6e3e;
            letter-spacing: 0.1rem; margin: 0 0 10px 0; border-bottom: 1px dotted rgba(138,110,62,0.3); padding-bottom: 5px;
        }
        
        /* 给描述加一个引言样式，填补视觉空白 */
        .panel-desc {
            font-size: 1rem; 
            line-height: 1.8; 
            color: #d1c5a8; 
            text-align: justify;
            margin-bottom: 25px;
            position: relative;
            padding-left: 15px;
            border-left: 2px solid rgba(138,110,62,0.3);
            font-style: italic;
        }

        .panel-steps {
            font-family: "Songti SC", serif; 
            font-size: 0.95rem; 
            line-height: 1.8; 
            color: #a89573;
        }
        .panel-steps p { margin-top: 0; margin-bottom: 10px; display: flex; }
        .panel-steps span { color: #b85c58; font-weight: bold; margin-right: 10px; font-family: "Courier New", monospace; flex-shrink: 0; }

        /* 打印淡入动画 */
        .print-anim { animation: printOut 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes printOut {
            0% { opacity: 0; transform: translateY(10px); filter: blur(1px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* ==========================================
           04 / 厨房手记（保持不变，极简线框）
           ========================================== */
        .notes-board {
            display: flex; flex-direction: column; gap: 20px;
            width: 100%; max-width: 750px; margin: 0 auto;
        }
        .note-card {
            background: rgba(20, 20, 20, 0.6); border: 1px solid #3a3024; border-left: 3px solid #b85c58;
            padding: 20px 30px; position: relative; transition: all 0.3s; display: flex; align-items: center; gap: 20px;
        }
        .note-card:hover { border-color: #8a6e3e; border-left-color: #b85c58; background: rgba(30, 30, 30, 0.8); transform: translateX(5px); }
        .note-tag {
            font-family: "Courier New", monospace; font-size: 0.75rem; color: #b85c58;
            letter-spacing: 0.1rem; border: 1px solid #b85c58; padding: 4px 8px; flex-shrink: 0; opacity: 0.8;
        }
        .note-text { font-family: "KaiTi", "STKaiti", serif; font-size: 1.1rem; color: #d1c5a8; line-height: 1.6; }

        /* === 场景过渡遮罩 === */
        #transition-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #050505; z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 1s ease;
        }
        #transition-screen.active { opacity: 1; pointer-events: auto; }
        .trans-text { color: #8a6e3e; font-family: "Songti SC", serif; font-size: 1.2rem; letter-spacing: 0.3rem; opacity: 0; transform: translateY(10px); transition: all 1s ease 0.3s; }
        #transition-screen.active .trans-text { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <div class="hud-info">
        <span id="current-time">00:00</span>
        <span>13°C 阴雨</span>
        <span>芥川庄园 · 一楼厨房</span>
    </div>

    <a href="javascript:void(0)" class="back-btn" onclick="leaveRoom()">⎋ [ 离开厨房 ]</a>

    <div class="layout">
        <div class="sidebar">
            <h2 class="room-name">厨房</h2>
            <div class="room-desc">专属女仆 / 莉薇娅</div>
            <div class="nav-list">
                <div class="nav-item active" id="nav-quote" onclick="switchContent('quote')">01 / 她的语录</div>
                <div class="nav-item" id="nav-story" onclick="switchContent('story')">02 / 旧日往事</div>
                <div class="nav-item" id="nav-menu" onclick="switchContent('menu')">03 / 专属食单</div>
                <div class="nav-item" id="nav-notes" onclick="switchContent('notes')">04 / 厨房手记</div>
            </div>
        </div>
        <div class="content-area"><div class="text-box show" id="text-content"></div></div>
    </div>
    <div id="transition-screen"><div class="trans-text" id="trans-text"></div></div>

    <script>
        /* ================= 系统基础逻辑 ================= */
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }
        setInterval(updateTime, 1000); updateTime();

        let lastTrailTime = 0;
        document.addEventListener('mousemove', function(e) {
            const now = Date.now();
            if (now - lastTrailTime > 30) {
                const particle = document.createElement('div'); particle.className = 'cursor-trail';
                const offsetX = (Math.random() - 0.5) * 8; const offsetY = (Math.random() - 0.5) * 8;
                particle.style.left = (e.clientX + offsetX) + 'px'; particle.style.top = (e.clientY + offsetY) + 'px';
                const size = Math.random() * 4 + 2; particle.style.width = size + 'px'; particle.style.height = size + 'px';
                document.body.appendChild(particle); setTimeout(() => { particle.remove(); }, 800); lastTrailTime = now;
            }
        });

        let sharedAudioCtx = null;
        function getAudioCtx() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return null;
            if (!sharedAudioCtx || sharedAudioCtx.state === 'closed') sharedAudioCtx = new AudioContext();
            if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
            return sharedAudioCtx;
        }
        function playTypewriterSound() {
            try {
                const audioCtx = getAudioCtx(); if (!audioCtx) return;
                const now = audioCtx.currentTime; const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const source = audioCtx.createBufferSource(); source.buffer = buffer;
                const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 3000;
                const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.1, now + 0.01); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                source.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); source.start(now);
            } catch (e) {}
        }
        function playExitSound() {
            try {
                const audioCtx = getAudioCtx(); if (!audioCtx) return; const now = audioCtx.currentTime;
                for (let i = 0; i < 3; i++) {
                    const stepTime = now + (i * 0.4); const stepOsc = audioCtx.createOscillator();
                    stepOsc.type = 'sine'; stepOsc.frequency.setValueAtTime(80, stepTime); stepOsc.frequency.exponentialRampToValueAtTime(30, stepTime + 0.1);
                    const stepGain = audioCtx.createGain(); stepGain.gain.setValueAtTime(0, stepTime); stepGain.gain.linearRampToValueAtTime(0.2, stepTime + 0.02); stepGain.gain.exponentialRampToValueAtTime(0.01, stepTime + 0.15);
                    stepOsc.connect(stepGain); stepGain.connect(audioCtx.destination); stepOsc.start(stepTime); stepOsc.stop(stepTime + 0.2);
                }
            } catch (e) {}
        }
        function leaveRoom() {
            playExitSound(); document.getElementById('trans-text').innerText = '洗净手上的油烟，重回寂静的大厅。';
            document.getElementById('transition-screen').classList.add('active');
            setTimeout(() => { window.location.href = "index.html?open=true"; }, 1800);
        }

        /* ================= 图片配置 ================= */
        const IMG_BASE = 'https://miaozeze.github.io/';
        const RAW_BASE = 'https://raw.githubusercontent.com/miaozeze/miaozeze.github.io/main/';
        function imgTag(file, fallback, alt) {
            const primary = IMG_BASE + file; const secondary = RAW_BASE + file;
            return `<img src="${primary}" alt="${alt || '附件'}" data-fallback-raw="${secondary}" data-fallback-unsplash="${fallback || ''}" onerror="handleImgError(this)">`;
        }
        window.handleImgError = function(img) {
            const raw = img.dataset.fallbackRaw; const unsplash = img.dataset.fallbackUnsplash;
            if (raw && img.src !== raw) { img.src = raw; } else if (unsplash && img.src !== unsplash) { img.src = unsplash; }
        };

        /* ================= 各内容面板 ================= */
        const contentData = {
            quote: `
                <div class="quote-image-wrapper">
                    <img src="https://miaozeze.github.io/kitchen_quote.jpg" alt="厨房一角" data-fallback-raw="https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=800&q=80" onerror="this.src=this.dataset.fallbackRaw">
                    <div class="quote-image-caption">// 一尘不染的料理台</div>
                </div>
                <div class="quote-style"><p>“大小姐，这个点来厨房做什么？冷肉锁在柜子里，钥匙在我身上——您别想了。去餐桌坐着，我给您热杯牛奶。”</p></div>
            `,
            story: `
                <p>凌晨两点，厨房里还亮着灯。莉薇娅在擦一把银勺——擦银器这件事，她从来不看表。</p>
                <p>听到脚步声，她没回头：“这个点来厨房做什么？冷肉锁在柜子里，钥匙在我身上。”</p>
                <p>炉子上一直温着半壶牛奶。她说完才转过身，把杯子倒满，端到桌上，热气顶着杯沿：“只放了一点蜂蜜。糖别想——您那口牙。”</p>
                <p>“谁特地给您热的。”她把软布折了一道，又展开，“……炉子上正好有。顺手。”</p>
                <p>她站了一会儿，像有话要说，最后只落下半句：“明早要是再不吃饭——”</p>
                <p>话咽了回去。她转身回了操作台，重新擦起那把早就干净的勺子：“……早点喝完。”</p>
            `,
            menu: `
                <div class="kitchen-split-view">
                    <div class="menu-ticket-wrapper">
                        <div class="menu-ticket">
                            <div class="slip-header">
                                <div>AKUTAGAWA <br><span>KITCHEN</span></div>
                                <div style="text-align:right;">DATE: 11/06<br>TIME: 02:00 AM</div>
                            </div>
                            <div class="slip-cols"><div class="col-qty">QTY</div><div class="col-dish">DISHES</div></div>

                            <div class="slip-item active" id="slip-wellington" onclick="selectSlip('wellington', this)">
                                <div class="col-qty"><span class="checkbox"></span>01</div><div class="col-dish">古典惠灵顿牛排</div>
                            </div>
                            <div class="slip-item" id="slip-consomme" onclick="selectSlip('consomme', this)">
                                <div class="col-qty"><span class="checkbox"></span>01</div><div class="col-dish">法式清汤</div>
                            </div>
                            <div class="slip-item" id="slip-scone" onclick="selectSlip('scone', this)">
                                <div class="col-qty"><span class="checkbox"></span>02</div><div class="col-dish">约克郡司康饼</div>
                            </div>
                            <div class="slip-item" id="slip-oxtail" onclick="selectSlip('oxtail', this)">
                                <div class="col-qty"><span class="checkbox"></span>01</div><div class="col-dish">慢炖牛尾浓汤</div>
                            </div>
                        </div>
                    </div>

                    <div class="recipe-panel-wrapper">
                        <div class="panel-content" id="recipe-panel-content" style="width: 100%;"></div>
                    </div>
                </div>
            `,
            notes: `
                <div class="notes-board">
                    <div class="note-card"><div class="note-tag">MEMO 01</div><div class="note-text">厨房的采买预算又被埃德蒙那只狐狸砍了。他最好祈祷别让我发现采购单里的食材以次充好。</div></div>
                    <div class="note-card"><div class="note-tag">MEMO 02</div><div class="note-text">星野雫今天又把机油带进厨房了。警告他，再敢用擦机器的抹布碰大小姐的骨瓷杯，我就拔了他研究室的电线。</div></div>
                    <div class="note-card"><div class="note-tag">MEMO 03</div><div class="note-text">大小姐今天心情很差，晚饭没动。炉子上留了半碗清汤，等她半夜饿了热给她喝。别放糖。</div></div>
                </div>
            `
        };

        /* ================= 点菜单数据与交互 ================= */
        const slipData = {
            wellington: {
                title: "古典惠灵顿牛排",
                no: "RECIPE NO. 012 / MAIN COURSE",
                desc: "金黄酥皮包裹粉嫩牛柳，黑松露与蘑菇泥香气交织。是对火候掌控的极致考验，每一口都肉汁四溢。",
                steps: [
                    "牛柳海盐黑胡椒腌制，煎至表面焦化。",
                    "蘑菇洋葱切碎，黄油慢炒收干水分。",
                    "火腿抹蘑菇泥，卷入牛柳冷藏定型。",
                    "酥皮包裹后刷蛋黄液，烘烤至金黄。"
                ],
                img: imgTag('wellington.jpg', 'https://images.unsplash.com/photo-1600891964092-4316c288032e?auto=format&fit=crop&w=800&q=80', '惠灵顿牛排')
            },
            consomme: {
                title: "法式清汤",
                no: "RECIPE NO. 024 / SOUP",
                desc: "看似清如白水，实则凝聚了牛肉与香草的精华。历经数小时慢熬与多次过滤，清透却滋味醇厚。",
                steps: [
                    "牛骨与蔬菜慢熬六小时，萃取精华。",
                    "瘦牛肉剁成肉糜，与蛋清混合。",
                    "肉糜入冷汤加热，用肉盖吸附杂质。",
                    "保持微沸两小时，纱布过滤至纯净。"
                ],
                img: imgTag('consomme.jpg', 'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80', '法式清汤')
            },
            scone: {
                title: "约克郡司康饼",
                no: "RECIPE NO. 038 / TEA",
                desc: "外酥内软的经典英式茶点，带着淡淡的黄油香。掰开后抹上凝脂奶油与果酱，是下午茶的灵魂。",
                steps: [
                    "面粉与冷藏黄油搓揉成粗糙颗粒状。",
                    "加牛奶轻拌成团，切勿过度揉搓起筋。",
                    "擀平至两厘米厚，用圆形模具按压。",
                    "表面刷牛奶，烘烤至金黄趁热食用。"
                ],
                img: imgTag('scone.jpg', 'https://images.unsplash.com/photo-1599420186946-7b6fb4e297f0?auto=format&fit=crop&w=800&q=80', '司康饼')
            },
            oxtail: {
                title: "慢炖牛尾浓汤",
                no: "RECIPE NO. 045 / NIGHT SNACK",
                desc: "红宝石般的汤底，牛尾经长时间慢炖软烂脱骨，胶质完全融入汤汁。搭配烤脆面包片，是冬日最深的暖意。",
                steps: [
                    "牛尾洗净擦干，入锅煎至各面焦糖色。",
                    "原锅黄油炒香洋葱与番茄膏。",
                    "倒红酒刮起锅底精华，加高汤慢炖。",
                    "取出牛尾去骨切肉，汤汁收浓调味。"
                ],
                img: imgTag('oxtail.jpg', 'https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=800&q=80', '牛尾浓汤')
            }
        };

        function selectSlip(key, element) {
            playTypewriterSound();
            document.querySelectorAll('.slip-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            const data = slipData[key];
            const panel = document.getElementById('recipe-panel-content');
            
            panel.innerHTML = `
                <div class="print-anim editorial-cover">
                    <!-- 左侧：全高大图 -->
                    <div class="cover-image-left">
                        ${data.img}
                        <div class="cover-image-caption">// 出餐留影</div>
                    </div>
                    
                    <!-- 右侧：文字区（整体垂直居中） -->
                    <div class="cover-text-right">
                        <h2 class="panel-title">${data.title}</h2>
                        <div class="panel-no">${data.no}</div>
                        
                        <div class="sec-title">// 风味描述</div>
                        <div class="panel-desc">${data.desc}</div>
                        
                        <div class="sec-title">// 制作方法</div>
                        <div class="panel-steps">
                            ${data.steps.map((step, i) => `<p><span>[${i+1}]</span> ${step}</p>`).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        /* ================= 内容切换 ================= */
        let isAnimating = false;
        function switchContent(type) {
            if (isAnimating) return;
            isAnimating = true;

            const textBox = document.getElementById('text-content');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const nav = document.getElementById(`nav-${type}`);
            if (nav) nav.classList.add('active');

            textBox.classList.remove('show');

            setTimeout(() => {
                textBox.innerHTML = contentData[type];
                textBox.scrollTop = 0;
                
                if (type === 'menu') {
                    const firstItem = document.getElementById('slip-wellington');
                    if (firstItem) selectSlip('wellington', firstItem);
                }

                textBox.classList.add('show');
                isAnimating = false;
            }, 400);
        }

        document.getElementById('text-content').innerHTML = contentData.quote;
    </script>
</body>
</html>
