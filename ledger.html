<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账房 | 纸页与灰烬</title>
    <style>
        /* === 基础页面：默认使用羽毛笔 === */
        body {
            margin: 0; padding: 0; background-color: #0a0a0a; color: #c9bda5;
            font-family: Georgia, Garamond, "Noto Serif SC", "Songti SC", serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 50% 30%, #151515 0%, #050505 70%);
            overflow: hidden; -webkit-font-smoothing: antialiased;
            /* 羽毛笔指针 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>') 2 22, auto;
        }

        .hud-info {
            position: fixed; top: 30px; left: 40px; font-family: "Courier New", monospace;
            color: #8a6e3e; font-size: 0.8rem; letter-spacing: 0.15rem; z-index: 102;
            display: flex; gap: 15px;
        }
        .hud-info span { padding-bottom: 3px; border-bottom: 1px solid rgba(138, 110, 62, 0.3); }

        /* 返回按钮：放大镜指针 */
        .back-btn {
            position: fixed; top: 30px; right: 40px; padding: 10px 24px; color: #e8d5b5; font-size: 0.85rem; letter-spacing: 0.2rem;
            border: 1px solid #5a4a2e; background: rgba(30, 30, 30, 0.8); border-radius: 4px; text-decoration: none; z-index: 102; transition: all 0.3s ease;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .back-btn:hover { color: #fff; border-color: #9e8a63; background: rgba(158,138,99,0.2); }

        /* 鼠标拖尾样式 */
        .cursor-trail {
            position: fixed; width: 4px; height: 4px; background: #f5e6c8; border-radius: 50%;
            pointer-events: none; z-index: 9999; box-shadow: 0 0 10px 2px rgba(245, 230, 200, 0.8);
            animation: fadeOutTrail 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes fadeOutTrail { 0% { transform: scale(1) translateY(0); opacity: 1; } 100% { transform: scale(0) translateY(15px); opacity: 0; } }

        /* === 核心布局 === */
        .layout {
            display: flex; width: 95%; max-width: 1280px; height: 85vh; gap: 40px;
        }

        /* 左侧：导航 */
        .sidebar {
            width: 240px; display: flex; flex-direction: column; justify-content: center;
            border-right: 1px solid rgba(90, 74, 46, 0.3); padding-right: 40px;
            position: relative; flex-shrink: 0;
        }

        .room-name { font-size: 3rem; color: #f5e6c8; margin: 0 0 0.5rem 0; font-weight: normal; letter-spacing: 0.2rem; }
        .room-desc { font-family: "Courier New", monospace; font-size: 0.75rem; color: #8a6e3e; letter-spacing: 0.15rem; text-transform: uppercase; margin-bottom: 4rem; }

        .nav-list { display: flex; flex-direction: column; gap: 20px; }

        /* 导航菜单：放大镜指针 */
        .nav-item {
            font-size: 1rem; color: #8a6e3e; letter-spacing: 0.15rem; 
            transition: all 0.3s; display: flex; align-items: center; gap: 10px;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .nav-item::before { content: '—'; color: transparent; transition: color 0.3s; }
        .nav-item:hover, .nav-item.active { color: #f5e6c8; padding-left: 10px; }
        .nav-item:hover::before, .nav-item.active::before { color: #f5e6c8; }

        /* 隐藏的暗门触发：放大镜指针 */
        .secret-nav {
            margin-top: 3rem; font-family: "Courier New", monospace; font-size: 0.75rem;
            color: #1f1a14; letter-spacing: 0.1rem; transition: all 0.5s ease;
            user-select: none;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .secret-nav:hover { color: #b85c58; text-shadow: 0 0 10px rgba(184, 92, 88, 0.3); }
        .secret-nav.active { color: #b85c58; font-weight: bold; }

        /* 右侧：内容区 */
        .content-area {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            padding: 2rem 0; position: relative;
        }

        .text-box {
            max-height: 75vh; overflow-y: auto; padding-right: 20px;
            font-family: "Songti SC", "Noto Serif SC", serif;
            font-size: 1.1rem; color: #d1c5a8; line-height: 2.2; text-align: justify;
            letter-spacing: 0.05rem; opacity: 0; transition: opacity 0.4s ease;
        }
        .text-box::-webkit-scrollbar { display: none; }
        .text-box.show { opacity: 1; }
        
        .text-box.keys-view { overflow: visible; max-height: none; }

        /* ==========================================
           语录上方的宽幅图片
           ========================================== */
        .quote-image-wrapper {
            width: 100%; max-width: 600px; margin: 0 auto 2.5rem auto;
            background: #12100d; border: 2px solid #6e5a3a; padding: 8px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(158, 138, 99, 0.1);
        }
        .quote-image-wrapper img {
            width: 100%; height: 240px; object-fit: cover; object-position: center 35%;
            filter: sepia(40%) grayscale(30%) brightness(0.7); display: block;
        }
        .quote-image-caption {
            text-align: center; font-family: "Courier New", monospace; font-size: 0.75rem;
            color: #8a6e3e; margin-top: 10px; letter-spacing: 0.15rem;
        }

        .quote-style {
            font-style: italic; font-size: 1.25rem; color: #e8d5b5; line-height: 2.2; text-indent: 2em;
            padding: 1.5rem 2rem; background: rgba(20,20,20,0.4); border-left: 2px solid #5a4a2e;
        }

        /* ==========================================
           专属排版：大账本
           ========================================== */
        .ledger-book-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }

        .book {
            display: flex; width: 950px; height: 70vh; max-height: 600px;
            background: #151310; border: 1px solid #3a3024; border-radius: 8px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.95), inset 0 0 30px rgba(0,0,0,0.8);
            position: relative; transform: rotate(-1deg); transition: transform 0.4s;
        }
        .book:hover { transform: rotate(0deg) translateY(-5px); }

        .book::after {
            content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 40px;
            background: linear-gradient(to right, rgba(0,0,0,0.5), rgba(0,0,0,0.1), rgba(0,0,0,0.5));
            transform: translateX(-50%); pointer-events: none; z-index: 2;
        }

        .book-page {
            flex: 1; padding: 40px; position: relative; display: flex; flex-direction: column;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.05"/></svg>');
        }
        .page-left { border-right: 1px solid rgba(90, 74, 46, 0.4); }
        .page-right { border-left: 1px solid rgba(255, 255, 255, 0.02); }

        .ledger-title {
            font-family: "Courier New", monospace; font-size: 1rem; color: #8a6e3e;
            text-align: center; border-bottom: 2px solid #5a4a2e; padding-bottom: 15px; margin-bottom: 25px;
            letter-spacing: 0.2rem; flex-shrink: 0;
        }

        /* 账目列表：放大镜指针 */
        .ledger-item-row {
            display: flex; justify-content: space-between; align-items: center; font-family: "Courier New", monospace;
            font-size: 0.95rem; color: #c9bda5; border-bottom: 1px dotted #3a3024;
            padding: 16px 10px; transition: all 0.3s; border-left: 2px solid transparent;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .ledger-item-row:hover { background: rgba(158, 138, 99, 0.05); color: #fff; }
        .ledger-item-row.active { background: rgba(158, 138, 99, 0.1); border-left-color: #b85c58; color: #f5e6c8; }

        /* 右页：真正的账目备注排版 */
        .detail-box { 
            flex: 1; display: flex; flex-direction: column; justify-content: space-between; 
            position: relative; 
        }

        .detail-note { font-family: "KaiTi", "STKaiti", serif; color: #b85c58; font-size: 1.05rem; line-height: 1.8; transform: rotate(-1deg); }
        .detail-title { font-weight: bold; border-bottom: 1px dashed #b85c58; padding-bottom: 5px; margin-bottom: 15px; font-size: 1.2rem; }

        .note-label { color: #8a6e3e; font-family: "Courier New", monospace; font-size: 0.85rem; margin-right: 5px; }
        .note-content { margin-bottom: 12px; }

        /* ✨ 极简暗金 ✨ */
        .detail-photo {
            width: 180px; height: 230px; align-self: flex-end; position: relative; flex-shrink: 0;
            margin-right: 0; margin-bottom: 20px; transition: all 0.3s ease;
            background: #12100d; border: 2px solid #6e5a3a; padding: 6px; box-sizing: border-box;
            box-shadow: 0 0 15px rgba(158, 138, 99, 0.15), -5px 5px 20px rgba(0,0,0,0.8); transform: rotate(2deg);
            display: flex; flex-direction: column;
            /* 照片悬停：放大镜指针 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .detail-photo:hover { transform: rotate(0deg) scale(1.04); border-color: #d1b580; box-shadow: 0 0 25px rgba(209, 181, 128, 0.3), -5px 8px 25px rgba(0,0,0,0.9); }
        .detail-photo img { width: 100%; flex: 1; object-fit: cover; filter: sepia(20%) grayscale(10%) brightness(0.9); transition: all 0.3s ease; display: block; }
        .detail-photo:hover img { filter: sepia(10%) grayscale(0%) brightness(1.05); }
        .photo-caption {
            height: 28px; display: flex; align-items: center; justify-content: center;
            font-family: "Courier New", monospace; font-size: 0.75rem; color: #d1c5a8; 
            letter-spacing: 1px; transition: color 0.3s; margin-top: 4px; 
        }
        .detail-photo:hover .photo-caption { color: #f5e6c8; }

        /* ==========================================
           ✨ 专属排版：门禁密钥卡套 ✨
           ========================================== */
        .sleeve-wrapper {
            display: flex; width: 100%; max-width: 850px; height: 65vh; max-height: 550px;
            margin: 0 auto; gap: 50px; justify-content: center; align-items: center;
        }

        .key-selectors { display: flex; flex-direction: column; gap: 15px; }
        /* 圆钮：放大镜指针 */
        .key-sel-item {
            width: 58px; height: 58px; border-radius: 50%;
            border: 1px solid #333; display: flex; justify-content: center; align-items: center;
            font-family: "KaiTi", serif; font-size: 0.85rem; color: #888;
            letter-spacing: 1px; transition: all 0.3s; background: #111;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }
        .key-sel-item:hover { border-color: #cfa861; color: #cfa861; }
        .key-sel-item.active { border-color: #cfa861; color: #111; background: #cfa861; box-shadow: 0 0 20px rgba(207,168,97,0.4); font-weight: bold; }
        .key-sel-item.unlisted { opacity: 0.4; }
        .key-sel-item.unlisted.active { opacity: 1; background: #8a6e3e; border-color: #8a6e3e; color: #111; }

        /* 卡套容器：放大镜指针 */
        .sleeve-container { 
            position: relative; width: 340px; height: 480px; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="%23f5e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') 11 11, pointer !important;
        }

        .sleeve-back {
            position: absolute; top: 40px; left: 0; width: 100%; height: 440px;
            background-color: #1a1a1a;
            background-image: 
                repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px),
                url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.08"/></svg>');
            border-radius: 8px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 0 40px rgba(0,0,0,0.6);
            z-index: 5; border: 1px solid #0f0f0f;
            -webkit-mask-image: radial-gradient(circle at 50% 0, transparent 25px, black 26px);
            mask-image: radial-gradient(circle at 50% 0, transparent 25px, black 26px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.4s, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .sleeve-emboss {
            font-family: "Times New Roman", serif; font-size: 3.2rem; font-weight: bold;
            color: #cfa861; letter-spacing: 0.2rem; text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
            position: absolute; top: 45%; transform: translateY(-50%);
            opacity: 0.9; transition: opacity 0.4s, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .sleeve-logo {
            position: absolute; bottom: 30px; font-family: "Times New Roman", serif;
            font-size: 1rem; color: #cfa861; letter-spacing: 0.4rem; opacity: 0.8;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .sleeve-container.pulled .sleeve-back { opacity: 0.15; transform: translateY(50px); }
        .sleeve-container.pulled .sleeve-emboss { opacity: 0.1; transform: translateY(calc(-50% + 50px)); }
        .sleeve-container.pulled .sleeve-logo { transform: translateY(50px); }

        .access-card {
            position: absolute; top: 0; left: 20px; width: 300px; height: 440px;
            background-color: #0c0c0c;
            background-image: 
                linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 40%, rgba(0,0,0,0.6) 100%),
                url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.05"/></svg>');
            border-radius: 6px;
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.9), 
                0 2px 4px rgba(0,0,0,0.8),
                inset 0 0 0 1px rgba(207, 168, 97, 0.3), 
                inset 0 1px 0 rgba(255, 255, 255, 0.1); 
            z-index: 2;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), z-index 0s, box-shadow 0.6s;
            padding: 25px 20px; box-sizing: border-box;
            display: flex; flex-direction: column; transform: translateY(0);
            overflow: hidden;
        }

        .access-card::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(to right, transparent 0%, rgba(255, 255, 255, 0.02) 40%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.02) 60%, transparent 100%);
            transform: rotate(25deg) translateX(-100%); transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: none; z-index: 3;
        }
        .sleeve-container:hover .access-card::after { transform: rotate(25deg) translateX(50%); }
        .sleeve-container:hover:not(.pulled) .access-card { transform: translateY(-30px); }

        .sleeve-container.pulled .access-card {
            transform: translateY(-160px) scale(1.05); z-index: 10;
            box-shadow: 
                0 40px 100px rgba(0,0,0,1), 
                0 5px 15px rgba(0,0,0,0.9),
                inset 0 0 0 1px rgba(207, 168, 97, 0.6), 
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .key-object {
            position: absolute; width: 140px; height: 140px; bottom: -10px; right: -60px; opacity: 0;
            transform: translateY(30px) scale(0.8) rotate(-20deg); transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1; pointer-events: none; 
        }
        .key-object svg { width: 100%; height: 100%; filter: drop-shadow(6px 10px 12px rgba(0,0,0,0.9)) drop-shadow(0 0 15px rgba(207, 168, 97, 0.3)); }
        .sleeve-container.pulled .key-object { opacity: 1; transform: translateY(-160px) scale(1) rotate(15deg); z-index: 11; }

        .card-content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; }
        .card-head {
            width: 100%; display: flex; justify-content: space-between; align-items: baseline;
            font-family: "Times New Roman", serif; font-size: 0.7rem; color: #c4b18e; letter-spacing: 0.15rem;
            border-bottom: 1px solid rgba(207, 168, 97, 0.3); padding-bottom: 10px;
            margin-bottom: 20px; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .card-body { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; }
        .card-title {
            font-family: "KaiTi", serif; font-size: 1.8rem; color: #f5e6c8; font-weight: bold; letter-spacing: 0.1rem;
            margin-top: 10px; text-shadow: 1px 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(245, 230, 200, 0.2);
        }
        .card-en-small { font-family: "Times New Roman", serif; font-size: 0.75rem; color: #888; letter-spacing: 0.2rem; margin-top: 5px; margin-bottom: 25px; }
        .card-rule {
            font-family: "KaiTi", serif; font-size: 1rem; color: #c9bda5; line-height: 1.9;
            text-align: center; padding: 15px; background: rgba(0,0,0,0.3);
            border-radius: 4px; border: 1px dashed rgba(207, 168, 97, 0.25);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6), inset 0 1px 2px rgba(0,0,0,0.8); width: 100%;
        }

        /* ✨ 统一修改：所有卡片的批注都像研究室一样自然换行、两端对齐 ✨ */
        .card-note { 
            font-family: "KaiTi", serif; 
            font-size: 0.9rem; 
            color: #8a6e3e; 
            font-style: italic; 
            margin-top: auto; 
            text-align: justify; /* 改为两端对齐，自然换行 */
            width: 100%; 
            padding-top: 15px;
            line-height: 1.6; 
        }

        /* ==========================================
           专属排版：奥斯汀旧债（独立解密页面）
           ========================================== */
        .secret-page { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; max-width: 750px; }
        .secret-header { font-family: "Courier New", monospace; font-size: 1rem; color: #8a6e3e; margin-bottom: 2rem; letter-spacing: 0.2rem; }
        .secret-content-layout { display: flex; gap: 40px; align-items: center; }
        .secret-text-area { flex: 1; position: relative; padding: 2rem; border-left: 2px solid #b85c58; background: rgba(20, 10, 10, 0.4); min-height: 200px; display: flex; flex-direction: column; justify-content: center; }
        .secret-photo-area { width: 260px; flex-shrink: 0; transition: opacity 1.5s ease, visibility 1.5s ease, transform 1.5s cubic-bezier(0.25, 1, 0.5, 1); opacity: 0; visibility: hidden; transform: translateX(30px); }
        
        /* 旧债照片：放大镜指针 */
        .secret-photo { 
            background: #111; border: 1px solid #3a3024; padding: 10px 10px 35px 10px; box-shadow: -8px 12px 30px rgba(0,0,0,0.9); transform: rotate(-3deg); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden;

    <script>
        /* ================= 时钟 ================= */
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent =
                `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }
        setInterval(updateTime, 1000); updateTime();

        /* ================= 鼠标拖尾 ================= */
        let lastTrailTime = 0;
        document.addEventListener('mousemove', function(e) {
            const now = Date.now();
            if (now - lastTrailTime > 30) {
                const particle = document.createElement('div');
                particle.className = 'cursor-trail';
                const offsetX = (Math.random() - 0.5) * 8;
                const offsetY = (Math.random() - 0.5) * 8;
                particle.style.left = (e.clientX + offsetX) + 'px';
                particle.style.top = (e.clientY + offsetY) + 'px';
                const size = Math.random() * 4 + 2;
                particle.style.width = size + 'px'; particle.style.height = size + 'px';
                document.body.appendChild(particle);
                setTimeout(() => { particle.remove(); }, 800);
                lastTrailTime = now;
            }
        });

        /* ================= 音频引擎 ================= */
        let sharedAudioCtx = null;
        function getAudioCtx() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return null;
            if (!sharedAudioCtx || sharedAudioCtx.state === 'closed') sharedAudioCtx = new AudioContext();
            if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
            return sharedAudioCtx;
        }

        // 离开账房的合成音效（合书声 + 脚步声）
        function playExitSound() {
            try {
                const audioCtx = getAudioCtx();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;

                // 1. 沉闷的合书声
                const thumpOsc = audioCtx.createOscillator();
                thumpOsc.type = 'sine';
                thumpOsc.frequency.setValueAtTime(120, now);
                thumpOsc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
                const thumpGain = audioCtx.createGain();
                thumpGain.gain.setValueAtTime(0, now);
                thumpGain.gain.linearRampToValueAtTime(0.6, now + 0.02);
                thumpGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                thumpOsc.connect(thumpGain); thumpGain.connect(audioCtx.destination);
                thumpOsc.start(now); thumpOsc.stop(now + 0.2);

                // 2. 渐行渐远的脚步声
                for (let i = 0; i < 3; i++) {
                    const stepTime = now + 0.3 + (i * 0.4);
                    const stepOsc = audioCtx.createOscillator();
                    stepOsc.type = 'sine';
                    stepOsc.frequency.setValueAtTime(80, stepTime);
                    stepOsc.frequency.exponentialRampToValueAtTime(30, stepTime + 0.1);
                    const stepGain = audioCtx.createGain();
                    stepGain.gain.setValueAtTime(0, stepTime);
                    stepGain.gain.linearRampToValueAtTime(0.2, stepTime + 0.02);
                    stepGain.gain.exponentialRampToValueAtTime(0.01, stepTime + 0.15);
                    stepOsc.connect(stepGain); stepGain.connect(audioCtx.destination);
                    stepOsc.start(stepTime); stepOsc.stop(stepTime + 0.2);
                }
            } catch (e) {}
        }

        function leaveRoom() {
            playExitSound();
            document.getElementById('trans-text').innerText = '将那些泛黄的秘密留在身后，重回寂静。';
            document.getElementById('transition-screen').classList.add('active');
            setTimeout(() => { window.location.href = "index.html?open=true"; }, 1800);
        }

        /* ================= 外部音效预加载池 ================= */
        const soundPool = {};
        function preloadSounds() {
            const urls = {
                ledger: 'https://miaozeze.github.io/ledger.mp3',
                seal: 'https://miaozeze.github.io/seal.mp3',
                // ⬇️ 请在这里换上你上传后的两个音频真实链接 ⬇️
                cardOut1: 'https://miaozeze.github.io/card_out1.mp3', 
                cardOut2: 'https://miaozeze.github.io/card_out2.mp3'  
            };
            
            for (const key in urls) {
                const audio = new Audio();
                audio.src = urls[key];
                audio.preload = "auto";
                audio.volume = 0.6;
                soundPool[key] = audio;
                audio.load();
            }
        }
        window.addEventListener('DOMContentLoaded', preloadSounds);

        function playSound(name) {
            const audio = soundPool[name];
            if (audio) {
                try {
                    audio.currentTime = 0;
                    audio.play().catch(err => console.log("音频播放受阻:", err));
                } catch (e) {}
            }
        }

        /* ================= 图片地址配置 ================= */
        const IMG_BASE = 'https://miaozeze.github.io/';

        function imgTag(file, fallback, alt) {
            const primary = IMG_BASE + file;
            const secondary = RAW_BASE + file;
            return `<img src="${primary}" alt="${alt || '附件'}" data-fallback-raw="${secondary}" data-fallback-unsplash="${fallback || ''}" onerror="handleImgError(this)">`;
        }
        window.handleImgError = function(img) {
            const raw = img.dataset.fallbackRaw;
            const unsplash = img.dataset.fallbackUnsplash;
            if (raw && img.src !== raw) { img.src = raw; }
            else if (unsplash && img.src !== unsplash) { img.src = unsplash; }
        };

        /* ================= 账目数据 ================= */

            { id: "tea", name: "大吉岭红茶（特级）", price: "£ 120", noteTitle: "// 异常采买记录", noteText: `<div class="note-content"><span class="note-label">入账说明：</span>正常配给至二楼茶室。</div><div class="note-content"><span class="note-label">退货记录：</span>莉薇娅小姐亲自验收，以“香气不对”为由退回两罐。</div><div class="note-content"><span class="note-label">管家附言：</span>她对品质的要求，往往比预算更让人头疼。</div>`, imgFile: "26247621.jpg", imgFallback: "https://images.unsplash.com/photo-1576092762791-dd9e22204423?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80", imgCaption: "// 被退回的红茶" },

            { id: "dress", name: "晚宴定制礼服", price: "£ 2,400", noteTitle: "// 专项采买", noteText: `<div class="note-content"><span class="note-label">采买事由：</span>中村家联姻晚宴指定高定。</div><div class="note-content"><span class="note-label">验收记录：</span>大小姐极度抗拒，未进行试穿。</div><div class="note-content"><span class="note-label">管家附言：</span>内衬已暗中联系裁缝改为可拆卸设计，以备晚宴突发状况。</div>`, imgFile: "3673d324.jpg", imgFallback: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80", imgCaption: "// 晚宴礼服草图" },
            { id: "cookie", name: "温室特供香草曲奇", price: "£ 45", noteTitle: "// 私人支出", noteText: `<div class="note-content"><span class="note-label">入账说明：</span>自费购入顶级香草荚与黄油。</div><div class="note-content"><span class="note-label">异常记录：</span>借用温室烤箱，未惊动厨房。</div><div class="note-content"><span class="note-label">管家附言：</span>大小姐今天心情欠佳。这笔钱不走公账，记在我的私人名下。</div>`, imgFile: "a6ed3d01.jpg", imgFallback: "https://images.unsplash.com/photo-1499636136210-6f4ee915583e?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80", imgCaption: "// 刚出炉的曲奇" }
        ];

        ledgerData.forEach((item, index) => {
            const activeClass = index === 0 ? 'active' : '';
            itemsHTML += `<div class="ledger-item-row ${activeClass}" id="row-${item.id}" onclick="selectLedgerItem('${item.id}')"><span>${item.name}</span><span>${item.price}</span></div>`;

                    <div class="access-card">

                    <div class="key-object" id="key-object">
                        <svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#f5e6c8" /><stop offset="40%" stop-color="#cfa861" />

                            <path d="M 50 15 C 30 15, 20 30, 20 45 C 20 55, 25 62, 32 66 L 32 75 L 68 75 L 68 66 C 75 62, 80 55, 80 45 C 80 30, 70 15, 50 15 Z" fill="url(#brassGrad)" stroke="#2b1d09" stroke-width="2"/>

                            <path d="M 46 110 L 70 110 L 70 116 L 54 116 L 54 120 L 64 120 L 64 126 L 46 126 Z" fill="url(#brassGrad)" stroke="#2b1d09" stroke-width="1.5"/>
                            <line x1="58" y1="110" x2="58" y2="116" stroke="#2b1d09" stroke-width="2"/>
                            <line x1="56" y1="120" x2="56" y2="126" stroke="#2b1d09" stroke-width="2"/>
                        </svg>
                    </div>
                </div>
            </div>
        `;

        const keyData = {
            main: { name: "正门", en: "MAIN", holder: "托马斯（随车）", rule: "夜里廿二时前交回门房。", note: "“钥匙在谁手上，门就是谁管的。这门太重，托马斯一个人推不开，但他从不抱怨。”" },
            side: { name: "侧门", en: "SIDE", holder: "老周", rule: "早六点领，晚六点还。", note: "“老周每天来得比鸡早。这扇门开得早，是为了让外面的新鲜东西能进来。”" },
            ledger: { name: "账房", en: "LEDGER", holder: "埃德蒙", rule: "随身带着，不要离身。丢了不必报官，先报你。", note: "“这里面装的不是钱，是庄园的底。我把它揣在最里面的口袋，连睡觉都不摘。”" },
            cellar: { name: "酒窖", en: "CELLAR", holder: "埃德蒙", rule: "随身带着。取酒登记：日期、几瓶、给谁。", note: "“大小姐偶尔会来拿一瓶。她不懂酒。她只认得那个味道——家主常喝的那个年份。”" },
            kitchen: { name: "厨房", en: "KITCHEN", holder: "莉薇娅小姐", rule: "能开厨房、储藏间和冷柜。旁人不借，你也不借——她说厨房归她，钥匙就归她。", note: "“她说厨房归她，钥匙就归她。这规矩我守得很严——我连碗都不碰，何况是钥匙。”" },
            lab: { name: "研究室", en: "UNLISTED", holder: "星野雫", rule: "册子里没有这一行。只在我心里记着。", note: "“他说过，‘我只管电’。我没把这把写进册子，也从不问他几点锁门。这房子里，总得有一把不用登记的钥匙。”" }
        };

        const contentData = {
            quote: `
                <div class="quote-image-wrapper">
                    <img src="https://miaozeze.github.io/ledger_quote.jpg" alt="账房一角">
                    <div class="quote-image-caption">// 黄铜台灯下的收支账本</div>
                </div>
                <div class="quote-style">
                    <p>“大小姐，来查账的话，文件在左手边第二格。要躲清静，热茶和薄荷饼干在桌上。</p>
                    <p>至于莉薇娅小姐那边——您本来就在账房帮我核采买单，不是吗？”</p>
                </div>
            `,
            story: `
                <p>账房里亮着一盏黄铜台灯。桌上摊着采买单和几页账，他那杯茶已经凉透了——他聊起温室里的薄荷时总这样。</p>
                <p>听到脚步声，他推了一下眼镜，没抬头：“大小姐，如果是来核对下个月的采买，文件在左手边第二格。”</p>
                <p>你伸手去碰桌上那叠旧账本，他先一步抽走，换了张空白的纸推到你面前。</p>
                <p>“这些我来整理。”他抬起头，眼里带着笑意，“饼干刚出炉，我先替您尝过一块——上一块是检查，这一块是私心。”</p>
                <p>你把来意说了。他听完，笑意没变，只把椅子往回挪了半步。</p>
                <p>“躲清静？可以。”他重新低下头，“莉薇娅小姐那边我替您说——她非常专业，只是脾气像只炸毛的猫。这话她听了，大概能消停半个钟头。”</p>
                <p>你问他刚才在想什么。</p>
                <p>“在想账单。您要听哪一页？”</p>
            `,
            ledger: `
                <div class="ledger-book-wrapper">
                    <div class="book">
                        <div class="book-page page-left">
                            <div class="ledger-title">庄园十月收支明细</div>
                            <div style="overflow-y: auto; padding-right: 5px; height: 100%;">${itemsHTML}</div>
                        </div>
                        <div class="book-page page-right" id="ledger-detail-page"></div>
                    </div>
                </div>
            `,
            keys: sleeveHTML,
            secret: `
                <div class="secret-page">
                    <div class="secret-header">FILE NO. // 奥斯汀旧债（邓恩）</div>
                    <div class="secret-content-layout">
                        <div class="secret-text-area">
                            <div class="detail-title">// 关于那笔旧债</div>
                            <p class="detail-note" style="margin-bottom: 0;">
                                <span class="redacted" id="debt-text">钱以杂项摊平，追债的人已经被我挡回去了。这件事，永远别让莉薇娅知道。我会把它带进棺材里。</span>
                            </p>
                            <div class="wax-seal-lock" id="debt-seal" onclick="unlockDebt(this)"></div>
                        </div>
                        <div class="secret-photo-area" id="secret-photo-area">
                            <div class="secret-photo">
                                ${imgTag('ff632647.jpg', RAW_BASE + 'ff632647.jpg', '债务附件')}
                            </div>
                        </div>
                    </div>
                </div>
            `
        };

        function renderLedgerDetail(item) {
            const detailPage = document.getElementById('ledger-detail-page');
            if (!detailPage) return;
            detailPage.innerHTML = `
                <div class="ledger-title">批注与备忘</div>
                <div class="detail-box">
                    <div class="detail-note">
                        <div class="detail-title">${item.noteTitle}</div>
                        ${item.noteText}
                    </div>
                    <div class="detail-photo">
                        ${imgTag(item.imgFile, item.imgFallback, '附件')}
                        <div class="photo-caption">${item.imgCaption}</div>
                    </div>
                </div>
            `;
        }

        function initLedgerDetail() { renderLedgerDetail(ledgerData[0]); }

        function selectLedgerItem(id) {
            playSound('ledger');
            document.querySelectorAll('.ledger-item-row').forEach(el => el.classList.remove('active'));
            const row = document.getElementById(`row-${id}`);
            if (row) row.classList.add('active');

            const itemData = ledgerData.find(d => d.id === id);
            const detailPage = document.getElementById('ledger-detail-page');
            if (!detailPage || !itemData) return;

            detailPage.style.opacity = 0;
            setTimeout(() => {
                renderLedgerDetail(itemData);
                detailPage.style.opacity = 1;
            }, 200);
        }

        function updateSleeveContent(id, el) {
            document.querySelectorAll('.key-sel-item').forEach(p => p.classList.remove('active'));
            el.classList.add('active');

            const d = keyData[id];
            const content = document.getElementById('sleeve-card-content');
            const embossText = document.getElementById('sleeve-emboss-text');
            const container = document.getElementById('sleeve-container'); 
            const keyLabel = document.getElementById('key-label-text'); 
            
            embossText.textContent = d.en;
            if (keyLabel) keyLabel.textContent = d.name[0];

            content.innerHTML = `
                <div class="card-head">
                    <span>${d.holder}</span>
                    <span>AKUTAGAWA MANOR</span>
                </div>
                <div class="card-body">
                    <div class="card-title">${d.name}</div>
                    <div class="card-en-small">${d.en} GATE</div>
                    <div class="card-rule">${d.rule}</div>
                    <div class="card-note">${d.note}</div>
                </div>
            `;
            
            if (container.classList.contains('pulled')) {
                container.classList.remove('pulled');
            }
        }

        function toggleSleeve() {
            const container = document.getElementById('sleeve-container');
            
            container.classList.toggle('pulled');
            
            playSound('cardOut1'); 
            playSound('cardOut2'); 
        }

        let debtUnlocked = false;
        function unlockDebt(sealElement) {
            playSound('seal');
            debtUnlocked = true;
            
            sealElement.classList.add('seal-breaking');
            const photoArea = document.getElementById('secret-photo-area');
            if (photoArea) photoArea.classList.add('unlocked');

            setTimeout(() => {
                sealElement.style.display = 'none';
                const text = document.getElementById('debt-text');
                if (text) {
                    text.classList.add('revealed');
                    text.addEventListener('animationend', () => text.classList.remove('redacted'), { once: true });
                }
            }, 500);
        }

        let isAnimating = false;
        function switchContent(type) {
            if (isAnimating) return;
            isAnimating = true;

            if (type !== 'secret') { debtUnlocked = false; }

            const textBox = document.getElementById('text-content');
            document.querySelectorAll('.nav-item, .secret-nav').forEach(el => el.classList.remove('active'));
            const nav = document.getElementById(`nav-${type}`);
            if (nav) nav.classList.add('active');

            textBox.classList.remove('show');

            setTimeout(() => {
                textBox.innerHTML = contentData[type];
                textBox.scrollTop = 0;

                if (type === 'ledger') {
                    textBox.classList.remove('keys-view');
                    textBox.style.fontFamily = 'inherit';
                    initLedgerDetail();
                } else if (type === 'keys') {
                    textBox.classList.add('keys-view');
                    textBox.style.fontFamily = 'inherit';
                    const defaultSlot = document.querySelector('.key-sel-item');
                    if (defaultSlot) updateSleeveContent('ledger', defaultSlot);
                    const sleeveContainer = document.getElementById('sleeve-container');
                    if (sleeveContainer) sleeveContainer.classList.remove('pulled');
                } else {
                    textBox.classList.remove('keys-view');
                    textBox.style.fontFamily = '"Songti SC", "Noto Serif SC", serif';
                }

                textBox.classList.add('show');
                isAnimating = false;
            }, 400);
        }

        document.getElementById('text-content').innerHTML = contentData.quote;
    </script>
</body>
</html>
